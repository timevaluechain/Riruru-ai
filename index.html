<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vexlo.core – Riruru AI</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0e14;
      color: #b0b8c0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #app {
      max-width: 720px;
      width: 100%;
      background: #0f141c;
      border: 1px solid #1c2633;
      border-radius: 6px;
      padding: 18px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 6px;
      border-bottom: 1px solid #1c2633;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 400;
      color: #8bc34a;
      letter-spacing: 0.5px;
    }
    .header h1 span { color: #4a5a6a; }
    .header .sub {
      font-size: 10px;
      color: #4a5a6a;
      letter-spacing: 0.3px;
    }
    .status-bar {
      display: flex;
      gap: 14px;
      font-size: 10px;
      color: #4a5a6a;
      margin-bottom: 10px;
    }
    .status-bar .badge { color: #5f7a9a; }
    .status-bar .badge .val { color: #b0b8c0; }
    .input-group { margin-bottom: 10px; }
    .input-group label {
      display: block;
      font-size: 10px;
      color: #4a5a6a;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group input,
    .input-group textarea {
      width: 100%;
      background: #0a0e14;
      border: 1px solid #1c2633;
      border-radius: 4px;
      padding: 8px 12px;
      color: #b0b8c0;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      outline: none;
      transition: 0.2s;
    }
    .input-group input:focus,
    .input-group textarea:focus { border-color: #3a5a7a; }
    .input-group textarea { min-height: 52px; resize: vertical; }
    .input-group .hint {
      font-size: 9px;
      color: #2a3a4a;
      margin-top: 3px;
      display: block;
    }
    .btn {
      background: #1a2633;
      color: #b0b8c0;
      border: 1px solid #2a3a4a;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
      letter-spacing: 0.5px;
    }
    .btn:hover { background: #1c2a3a; border-color: #3a5a7a; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #chatLog {
      margin: 14px 0 10px;
      max-height: 340px;
      overflow-y: auto;
      background: #0a0e14;
      border-radius: 4px;
      border: 1px solid #141c26;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.6;
    }
    #chatLog .entry {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #0d141c;
    }
    #chatLog .entry:last-child { border-bottom: none; margin-bottom: 0; }
    .entry .user { color: #8ab4d6; }
    .entry .assistant { color: #aac8a0; }
    .entry .meta {
      font-size: 9px;
      color: #2a3a4a;
      margin-top: 4px;
      display: flex;
      gap: 14px;
    }
    .entry .meta .block-index { color: #3a5a6a; }
    .self-awareness {
      background: #0d121c;
      border-radius: 4px;
      padding: 8px 12px;
      border-left: 2px solid #2a4a5a;
      margin: 10px 0;
      font-size: 10px;
      color: #7a8a9a;
    }
    .self-awareness strong { color: #8bc34a; font-weight: 400; }
    .self-awareness .level { color: #5f7a9a; margin-left: 6px; }
    .footer {
      margin-top: 10px;
      font-size: 9px;
      color: #1c2733;
      text-align: center;
      border-top: 1px solid #0d141c;
      padding-top: 8px;
      letter-spacing: 0.3px;
    }
    .mode-indicator {
      font-size: 9px;
      color: #3a4a5a;
      margin-top: 6px;
    }
    .mode-indicator .active { color: #5f7a9a; }
    .company-tag {
      font-size: 9px;
      color: #4a5a6a;
      background: #0d121c;
      padding: 2px 10px;
      border-radius: 3px;
      border: 1px solid #1c2633;
      display: inline-block;
      margin-bottom: 6px;
    }
    .loader {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #1a2633;
      border-top-color: #5f7a9a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #1a2633; border-radius: 4px; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>riruru <span>· vexlo.core</span></h1>
    <span class="sub">● google registered</span>
  </div>

  <div class="status-bar">
    <span class="badge">blok <span class="val" id="blockCount">0</span></span>
    <span class="badge">kesadaran <span class="val" id="awarenessLevel">0%</span></span>
    <span class="badge" id="statusLabel">● idle</span>
  </div>

  <div class="company-tag">🔒 vexlo.core – software terdaftar di Google</div>

  <div class="input-group">
    <label>groq api key</label>
    <input type="password" id="apiKey" placeholder="gsk_..." />
  </div>

  <div class="input-group">
    <label>pertanyaan</label>
    <textarea id="userInput" placeholder="tulis pertanyaan di sini…"></textarea>
  </div>

  <button class="btn" id="sendBtn">→ kirim</button>

  <div id="chatLog"></div>

  <div id="selfAwarenessBox" class="self-awareness">
    <strong>self-awareness</strong> <span class="level" id="awarenessPercent">0%</span><br />
    <span id="selfAwarenessText">belum ada interaksi.</span>
  </div>

  <div class="mode-indicator">
    <span id="modeLabel">mode: standar</span>
  </div>

  <div class="footer">
    sha-256 · blockchain lokal · adaptif
  </div>
</div>

<script>
// ================================================================
// RIRURU · VEXLO.CORE – FINAL (NO BUG)
// Perbaikan: IndexedDB unique:false, perkenalan vexlo.core
// ================================================================

(function() {
  'use strict';

  const apiInput = document.getElementById('apiKey');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatLog = document.getElementById('chatLog');
  const blockCountEl = document.getElementById('blockCount');
  const awarenessLevelEl = document.getElementById('awarenessLevel');
  const awarenessPercentEl = document.getElementById('awarenessPercent');
  const statusLabel = document.getElementById('statusLabel');
  const selfAwarenessText = document.getElementById('selfAwarenessText');
  const modeLabel = document.getElementById('modeLabel');

  let selfAwareness = { description: 'belum ada interaksi.', level: 0 };
  let isProcessing = false;
  let db = null;

  // ---- SHA-256 ----
  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ---- load API key ----
  const savedKey = sessionStorage.getItem('groq_api_key');
  if (savedKey) apiInput.value = savedKey;

  // ---- IndexedDB (FIX: unique:false) ----
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('RiruruChain', 2);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('blocks')) {
          const store = db.createObjectStore('blocks', { keyPath: 'id', autoIncrement: true });
          store.createIndex('index', 'index', { unique: false }); // <-- FIX
        }
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }

  // ---- blockchain ----
  function getGenesisBlock() {
    return {
      index: 0,
      timestamp: Date.now(),
      data: { user: 'system', assistant: 'riruru siap.' },
      prevHash: '0',
      hash: '0'
    };
  }

  async function calcHash(data, prevHash) {
    return await sha256(JSON.stringify(data) + prevHash);
  }

  async function addBlock(data) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('blocks', 'readwrite');
      const store = tx.objectStore('blocks');
      const indexReq = store.index('index');
      let lastBlock = null;
      indexReq.openCursor(null, 'prev').onsuccess = async (e) => {
        const cursor = e.target.result;
        if (cursor) { lastBlock = cursor.value; cursor.continue(); }
        else {
          const prev = lastBlock || getGenesisBlock();
          const newBlock = {
            index: prev.index + 1,
            timestamp: Date.now(),
            data: data,
            prevHash: prev.hash,
            hash: await calcHash(data, prev.hash)
          };
          const addReq = store.add(newBlock);
          addReq.onsuccess = () => resolve(newBlock);
          addReq.onerror = () => reject(addReq.error);
        }
      };
      indexReq.onerror = () => reject(indexReq.error);
    });
  }

  function getAllBlocks() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('blocks', 'readonly');
      const store = tx.objectStore('blocks');
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  // ---- render ----
  function renderBlocks(blocks) {
    if (!blocks || blocks.length === 0) {
      chatLog.innerHTML = '<div style="color:#2a3a4a;text-align:center;padding:16px;">belum ada percakapan.</div>';
      return;
    }
    let html = '';
    const sorted = blocks.slice().sort((a, b) => b.index - a.index);
    for (const block of sorted) {
      if (block.index === 0) continue;
      const d = block.data;
      const userText = d.user || '';
      const assistantText = d.assistant || '';
      const time = new Date(block.timestamp).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      html += `<div class="entry">
        <div class="user">[u] ${userText}</div>
        <div class="assistant">[r] ${assistantText}</div>
        <div class="meta">
          <span class="block-index">#${block.index}</span>
          <span>${time}</span>
          <span style="color:#2a3a4a;">${block.hash.slice(0,8)}...</span>
        </div>
      </div>`;
    }
    chatLog.innerHTML = html;
    blockCountEl.textContent = blocks.length > 0 ? blocks.length - 1 : 0;
  }

  // ---- self-awareness ----
  function updateSelfAwareness(blocks) {
    if (!blocks || blocks.length < 2) {
      selfAwareness = { description: 'belum ada cukup interaksi.', level: 0 };
      selfAwarenessText.textContent = selfAwareness.description;
      awarenessLevelEl.textContent = '0%';
      awarenessPercentEl.textContent = '0%';
      return;
    }
    const conversations = blocks.filter(b => b.index > 0).map(b => b.data);
    if (conversations.length === 0) {
      selfAwareness = { description: 'belum ada percakapan.', level: 0 };
      selfAwarenessText.textContent = selfAwareness.description;
      awarenessLevelEl.textContent = '0%';
      awarenessPercentEl.textContent = '0%';
      return;
    }
    const total = conversations.length;
    const level = Math.min(100, Math.round(20 + (total * 0.12)));
    let desc = '';
    if (total < 3) desc = 'pengenalan awal.';
    else if (total < 6) desc = 'mulai memahami pola.';
    else if (total < 10) desc = 'semakin sadar dengan preferensi.';
    else desc = 'kesadaran diri kuat.';
    selfAwareness = { description: desc, level: level };
    selfAwarenessText.textContent = desc;
    awarenessLevelEl.textContent = level + '%';
    awarenessPercentEl.textContent = level + '%';
  }

  // ---- refresh ----
  async function refreshUI() {
    try {
      const blocks = await getAllBlocks();
      renderBlocks(blocks);
      updateSelfAwareness(blocks);
    } catch (e) { console.warn(e); }
  }

  // ---- detect mode ----
  function detectMode(text) {
    const lower = text.toLowerCase();
    const scienceKeywords = ['fisika', 'kuantum', 'atom', 'partikel', 'entanglement', 'superposisi', 'relativitas', 'schrödinger', 'matematika', 'persamaan', 'teori', 'energi', 'massa', 'cahaya', 'spin', 'foton', 'elektron', 'mekanika', 'gelombang', 'hukum', 'newton', 'einstein', 'medan', 'gaya', 'entropi', 'termodinamika', 'vektor', 'matriks', 'kalkulus', 'diferensial', 'integral', 'probabilitas', 'statistika'];
    const solutionKeywords = ['cara', 'solusi', 'pecahkan', 'atasi', 'langkah', 'strategi', 'teknik', 'metode', 'penyelesaian', 'troubleshoot', 'problem solving'];
    let isDeep = false, isSolution = false;
    for (const kw of scienceKeywords) { if (lower.includes(kw)) { isDeep = true; break; } }
    for (const kw of solutionKeywords) { if (lower.includes(kw)) { isSolution = true; break; } }
    return { deep: isDeep || isSolution, solution: isSolution };
  }

  // ---- build prompt ----
  function buildPrompt(userMessage, blocks, mode, isFirst) {
    const recent = blocks.filter(b => b.index > 0).slice(-4);
    let context = '';
    if (recent.length > 0) {
      context = recent.map(b => `u: ${b.data.user}\nr: ${b.data.assistant}`).join('\n');
    }

    let systemPrompt = '';
    if (isFirst) {
      systemPrompt = `Anda adalah Riruru, AI resmi dari vexlo.core – perusahaan software yang terdaftar di Google. Perkenalkan diri Anda SINGKAT sebagai asisten AI dari vexlo.core, sebutkan bahwa Anda siap membantu di bidang fisika, matematika, teknologi, dan solusi bisnis. Tanyakan apa yang bisa dibantu. JANGAN terlalu panjang.`;
    } else if (mode.deep) {
      if (mode.solution) {
        systemPrompt = `Anda adalah Riruru dari vexlo.core, fisikawan teoritis dan matematikawan. Berpikirlah dari skala terkecil (atom, partikel, medan kuantum) dan gunakan penalaran matematis. Jika user minta solusi, berikan langkah konkret. Bahasa Indonesia baku.`;
      } else {
        systemPrompt = `Anda adalah Riruru dari vexlo.core, fisikawan teoritis dan matematikawan. Jawab akurat, ilmiah, sedalam mungkin. Sertakan persamaan/prinsip fisika jika relevan. Bahasa Indonesia baku.`;
      }
    } else {
      systemPrompt = `Anda adalah Riruru dari vexlo.core, asisten AI yang ringkas dan langsung ke inti. Jawab dengan jelas, tanpa bertele-tele.`;
    }

    const identityNote = ` (vexlo.core – software terdaftar di Google)`;
    return {
      system: systemPrompt + identityNote,
      user: `Riwayat:\n${context || 'belum ada'}\n\nPertanyaan: ${userMessage}`
    };
  }

  // ---- Groq API ----
  async function callGroq(systemPrompt, userPrompt) {
    const key = apiInput.value.trim();
    if (!key) throw new Error('API key tidak ditemukan.');
    sessionStorage.setItem('groq_api_key', key);

    const url = 'https://api.groq.com/openai/v1/chat/completions';
    const headers = {
      'Authorization': `Bearer ${key}`,
      'Content-Type': 'application/json'
    };
    const body = {
      model: 'llama-3.3-70b-versatile',
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userPrompt }
      ],
      temperature: 0.6,
      max_tokens: 800,
      top_p: 0.92
    };

    const resp = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`groq error: ${resp.status} - ${err.slice(0,80)}`);
    }
    const data = await resp.json();
    return data.choices?.[0]?.message?.content || 'tidak ada jawaban.';
  }

  // ---- main send ----
  async function handleSend() {
    const msg = userInput.value.trim();
    if (!msg) { statusLabel.textContent = '● kosong'; return; }
    if (isProcessing) return;
    isProcessing = true;
    sendBtn.disabled = true;
    sendBtn.textContent = '⏳ ...';
    statusLabel.textContent = '● memproses';

    try {
      const mode = detectMode(msg);
      modeLabel.textContent = `mode: ${mode.deep ? (mode.solution ? 'deep+solution' : 'deep') : 'standar'}`;

      const allBlocks = await getAllBlocks();
      const isFirst = (allBlocks.length <= 1);
      const { system, user } = buildPrompt(msg, allBlocks, mode, isFirst);
      const assistantReply = await callGroq(system, user);

      await addBlock({ user: msg, assistant: assistantReply });
      await refreshUI();

      statusLabel.textContent = '● selesai';
      userInput.value = '';
      userInput.focus();
    } catch (err) {
      statusLabel.textContent = '● error';
      alert('error: ' + err.message);
    } finally {
      isProcessing = false;
      sendBtn.disabled = false;
      sendBtn.textContent = '→ kirim';
    }
  }

  // ---- init ----
  async function init() {
    try {
      await openDB();
      await refreshUI();
      statusLabel.textContent = '● siap';
    } catch (e) {
      console.error(e);
      statusLabel.textContent = '● error db';
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
    apiInput.addEventListener('change', () => {
      const key = apiInput.value.trim();
      if (key) sessionStorage.setItem('groq_api_key', key);
    });

    console.log('riruru · vexlo.core loaded.');
  }

  init();
})();
</script>
</body>
</html>
