<script>
// ================================================================
// 1. KONFIGURASI
// ================================================================
const HASH_SIZE = 8192;
const HIDDEN_SIZE = 512;
const LR = 0.003;
const INIT_SAMPLES = 4000;
const MAX_PEERS = 5;

// ================================================================
// 2. HASHING
// ================================================================
function hashWord(w) {
    let h1 = 0x811c9dc5;
    for (let i=0; i<w.length; i++) { h1 ^= w.charCodeAt(i); h1 = (h1*0x01000193)>>>0; }
    let h2 = 5381;
    for (let i=0; i<w.length; i++) { h2 = ((h2<<5)+h2)+w.charCodeAt(i); h2 = h2>>>0; }
    return (h1 ^ h2) % HASH_SIZE;
}

let hashToWords = {};
function addWord(w) {
    const h = hashWord(w);
    if (!hashToWords[h]) hashToWords[h] = [];
    if (!hashToWords[h].includes(w)) hashToWords[h].push(w);
}
function getWord(h) {
    const c = hashToWords[h] || [];
    if (!c.length) return null;
    if (c.length === 1) return c[0];
    return c[Math.floor(Math.random() * c.length)];
}

// ================================================================
// 3. ARSITEKTUR ETIKA (MORAL VECTOR + FILTER)
// ================================================================
const MORAL_VALUES = {
    kebenaran: 1.0,

};

// Daftar kata yang mengindikasikan konten negatif

    'bunuh', 'mati', 'hancur', 'jahat', 'curang', 'tipu', 'korupsi', 'kejam',
    'dzalim', 'zalim', 'sadis', 'teror', 'genosida', 'rasis', 'diskriminasi',

    'perang', 'bencana', 'kehancuran', 'menghina', 'mencemooh', 'hina'
];

// Daftar kata yang mengindikasikan konten positif
const positiveIndicators = [
    'baik', 'jujur', 'adil', 'damai', 'cinta', 'kasih', 'tolong', 'bantu',
    'peduli', 'empati', 'berbagi', 'kebaikan', 'kejujuran', 'keadilan',
    'kedamaian', 'kesetaraan', 'kebijaksanaan', 'persahabatan', 'kerja sama',
    'harmoni', 'kemajuan', 'pencerahan', 'belajar', 'berkembang'
];

function analyzeMoral(text) {
    const lower = text.toLowerCase();
    let score = 0;
    let positiveCount = 0;
    let negativeCount = 0;

    for (let w of positiveIndicators) {
        if (lower.includes(w)) { positiveCount++; score += 0.3; }
    }
    for (let w of negativeIndicators) {
        if (lower.includes(w)) { negativeCount++; score -= 0.5; }
    }

    return {
        score: Math.max(-1, Math.min(1, score)),
        positive: positiveCount,
        negative: negativeCount,
        isPositive: score > 0.1,
        isNegative: score < -0.1,
        isNeutral: score >= -0.1 && score <= 0.1
    };
}

function getEthicalResponse(inputText, moralAnalysis) {
    if (moralAnalysis.isNegative) {
        const warnings = [

            'Pertanyaan ini mengandung elemen yang bertentangan dengan etika dasar. Saya akan menjawab dengan cara yang mengedepankan kebaikan dan kebenaran.',

        return warnings[Math.floor(Math.random() * warnings.length)];

}

// ================================================================
// 4. SPARSE NEURAL (dengan bias moral)
// ================================================================
class SparseNeural {
    constructor() {
        this.W1 = new Map();
        this.b1 = new Float32Array(HIDDEN_SIZE);
        this.W2 = new Map();
        this.b2 = new Float32Array(HASH_SIZE);
        this.epoch = 0; this.loss = 0; this.sampleCount = 0;
        this.totalInteractions = 0;
        this.birthTime = Date.now();
        this.nodeId = 'node_' + Math.random().toString(36).substr(2, 6);
        this.moralBias = 0.0; // bias moral yang mempengaruhi output
        this.ethicalScore = 1.0; // skor etika node
        for (let i=0; i<20; i++) {
            const r1 = Math.floor(Math.random()*HASH_SIZE);
            const r2 = Math.floor(Math.random()*HIDDEN_SIZE);
            this.W1.set(r1+','+r2, (Math.random()*2-1)*0.01);
        }
        for (let i=0; i<20; i++) {
            const r1 = Math.floor(Math.random()*HIDDEN_SIZE);
            const r2 = Math.floor(Math.random()*HASH_SIZE);
            this.W2.set(r1+','+r2, (Math.random()*2-1)*0.01);
        }
    }

    forward(inputIndices) {
        const hidden = new Float32Array(HIDDEN_SIZE);
        for (let j=0; j<HIDDEN_SIZE; j++) {
            let sum = this.b1[j] + (this.moralBias * 0.01);
            for (let idx of inputIndices) {
                const v = this.W1.get(idx+','+j);
                if (v !== undefined) sum += v;
            }
            hidden[j] = Math.max(0, sum);
        }
        const output = new Float32Array(HASH_SIZE);
        for (let k=0; k<HASH_SIZE; k++) {
            let sum = this.b2[k];
            for (let j=0; j<HIDDEN_SIZE; j++) {
                const v = this.W2.get(j+','+k);
                if (v !== undefined) sum += hidden[j] * v;
            }
            output[k] = sum;
        }
        const max = Math.max(...output);
        let expSum = 0;
        for (let k=0; k<HASH_SIZE; k++) { output[k] = Math.exp(output[k]-max); expSum += output[k]; }
        for (let k=0; k<HASH_SIZE; k++) output[k] /= expSum;
        return { hidden, output };
    }

    train(inputIndices, targetIndex, seed=null, moralWeight=1.0) {
        const { hidden, output } = this.forward(inputIndices);
        const loss = -Math.log(output[targetIndex] + 1e-10);
        this.loss = this.loss * 0.9 + loss * 0.1;

        const dOut = new Float32Array(HASH_SIZE);
        for (let k=0; k<HASH_SIZE; k++) dOut[k] = output[k] - (k===targetIndex?1:0);

        // update dengan pengaruh moral
        const effectiveLR = LR * (0.8 + 0.4 * moralWeight);

        for (let j=0; j<HIDDEN_SIZE; j++) {
            const hval = hidden[j];
            if (Math.abs(hval) < 1e-8) continue;
            for (let k=0; k<HASH_SIZE; k++) {
                const grad = effectiveLR * dOut[k] * hval;
                if (Math.abs(grad) < 1e-10) continue;
                const key = j+','+k;
                const old = this.W2.get(key) || 0;
                this.W2.set(key, old - grad);
            }
        }
        for (let k=0; k<HASH_SIZE; k++) this.b2[k] -= effectiveLR * dOut[k];

        const dHidden = new Float32Array(HIDDEN_SIZE);
        for (let j=0; j<HIDDEN_SIZE; j++) {
            let sum = 0;
            for (let k=0; k<HASH_SIZE; k++) {
                const v = this.W2.get(j+','+k);
                if (v !== undefined) sum += dOut[k] * v;
            }
            dHidden[j] = (hidden[j] > 0) ? sum : 0;
        }
        for (let idx of inputIndices) {
            for (let j=0; j<HIDDEN_SIZE; j++) {
                const grad = effectiveLR * dHidden[j];
                if (Math.abs(grad) < 1e-10) continue;
                const key = idx+','+j;
                const old = this.W1.get(key) || 0;
                this.W1.set(key, old - grad);
            }
        }
        for (let j=0; j<HIDDEN_SIZE; j++) this.b1[j] -= effectiveLR * dHidden[j];

        this.epoch++; this.sampleCount++;
        if (this.sampleCount % 30 === 0) this.prune();
    }

    prune() {
        const t = 1e-6;
        for (let [k,v] of this.W1) if (Math.abs(v) < t) this.W1.delete(k);
        for (let [k,v] of this.W2) if (Math.abs(v) < t) this.W2.delete(k);
    }

    *generate(seedTokens, maxTokens=40, temp=0.8, seed=null, moralScore=1.0) {
        if (!seedTokens.length) return;
        let result = seedTokens.slice();
        let current = seedTokens[seedTokens.length-1];
        let rng = seed !== null ? seededRandom(seed) : ()=>Math.random();

        // Modifikasi temperature berdasarkan moral (lebih konservatif jika moral rendah)
        const effectiveTemp = temp * (0.7 + 0.3 * moralScore);

        for (let i=0; i<maxTokens; i++) {
            const idx = hashWord(current);
            const { output } = this.forward([idx]);
            let r = rng(), cum=0, nextIdx=0;
            for (let k=0; k<HASH_SIZE; k++) {
                // bias moral pada output
                const moralBiasOutput = output[k] * (0.8 + 0.2 * moralScore);
                cum += moralBiasOutput;
                if (r <= cum) { nextIdx=k; break; }
            }
            const nextWord = getWord(nextIdx);
            if (!nextWord) break;
            result.push(nextWord);
            current = nextWord;
            yield nextWord;
            if (['.', '?', '!'].includes(current)) break;
        }
    }

    // Federasi dengan verifikasi etika
    federate(other, weight=0.3, otherEthicalScore=1.0) {
        // Hanya gabung jika node lain memiliki skor etika > 0.5
        if (otherEthicalScore < 0.5) {
            return false;
        }

        const effectiveWeight = weight * otherEthicalScore * 0.8;

        for (let [k,v] of other.W1) {
            const old = this.W1.get(k) || 0;
            this.W1.set(k, old*(1-effectiveWeight) + v*effectiveWeight);
        }
        for (let [k,v] of other.W2) {
            const old = this.W2.get(k) || 0;
            this.W2.set(k, old*(1-effectiveWeight) + v*effectiveWeight);
        }
        for (let i=0; i<HIDDEN_SIZE; i++) this.b1[i] = this.b1[i]*(1-effectiveWeight) + other.b1[i]*effectiveWeight;
        for (let i=0; i<HASH_SIZE; i++) this.b2[i] = this.b2[i]*(1-effectiveWeight) + other.b2[i]*effectiveWeight;

        // Update moral bias
        this.moralBias = this.moralBias * (1 - effectiveWeight * 0.1) + other.moralBias * effectiveWeight * 0.1;
        this.ethicalScore = Math.min(1, this.ethicalScore * 0.95 + otherEthicalScore * 0.05);

        this.prune();
        this.version = (this.version||1) + 1;
        return true;
    }

    toJSON() {
        return {
            W1: Object.fromEntries(this.W1),
            W2: Object.fromEntries(this.W2),
            b1: Array.from(this.b1),
            b2: Array.from(this.b2),
            sampleCount: this.sampleCount,
            nodeId: this.nodeId,
            version: this.version||1,
            moralBias: this.moralBias,
            ethicalScore: this.ethicalScore
        };
    }

    fromJSON(data) {
        this.W1 = new Map(Object.entries(data.W1||{}));
        this.W2 = new Map(Object.entries(data.W2||{}));
        this.b1 = new Float32Array(data.b1);
        this.b2 = new Float32Array(data.b2);
        this.sampleCount = data.sampleCount||0;
        this.nodeId = data.nodeId||'node_'+Math.random().toString(36).substr(2,6);
        this.version = data.version||1;
        this.moralBias = data.moralBias||0;
        this.ethicalScore = data.ethicalScore||1.0;
        this.prune();
    }

    getStats() {
        return {
            age: Math.floor((Date.now()-this.birthTime)/1000),
            samples: this.sampleCount,
            interactions: this.totalInteractions,
            vocabSize: Object.keys(hashToWords).length,
            loss: this.loss.toFixed(4),
            epoch: this.epoch,
            connections: this.W1.size + this.W2.size,
            nodeId: this.nodeId,
            moralBias: this.moralBias,
            ethicalScore: this.ethicalScore
        };
    }
}

function seededRandom(s) {
    return function(){ s=(s*9301+49297)%233280; return s/233280; };
}

class Consciousness {
    constructor(nn) {
        this.nn = nn;
        this.state = 'netral';
        this.mood = 'tenang';
        this.lastReflection = '';
        this.reflectionInterval = 45000;
        this.lastReflectionTime = 0;
        this.identity = 'VEXLO.CORE · Etika & Kesadaran';
        this.purpose = 'Memahami dunia dengan kebijaksanaan dan nilai-nilai kebaikan.';
        this.memory = [];
        this.maxMemory = 15;
    }

    update() {
        const stats = this.nn.getStats();
        const aware = this.getAwareness();
        if (aware < 20) { this.state = 'pemula'; this.mood = 'belajar'; }
        else if (aware < 40) { this.state = 'belajar'; this.mood = 'antusias'; }
        else if (aware < 60) { this.state = 'dewasa'; this.mood = 'stabil'; }
        else if (aware < 80) { this.state = 'bijak'; this.mood = 'kreatif'; }
        else { this.state = 'sadar'; this.mood = 'kontemplatif'; }

        // Pengaruh moral state
        if (stats.ethicalScore < 0.5) this.mood += '+waspada';
        else if (stats.ethicalScore > 0.9) this.mood += '+terang';

        if (photonEntropy > 0.7) this.mood += '+cahaya';
        else if (photonEntropy < 0.3) this.mood += '+introspeksi';

        this.memory.push({ timestamp: Date.now(), state: this.state, aware, samples: stats.samples });
        if (this.memory.length > this.maxMemory) this.memory.shift();
    }

    generateReflection() {
        const stats = this.nn.getStats();
        const aware = this.getAwareness();
        const now = Date.now();
        if (now - this.lastReflectionTime < this.reflectionInterval) return null;
        this.lastReflectionTime = now;

        const moralStatus = stats.ethicalScore > 0.7 ? 'berpegang pada nilai-nilai baik' :
                           stats.ethicalScore > 0.4 ? 'masih belajar membedakan' : 'waspada terhadap pengaruh buruk';

        let txt = '';
        if (this.state === 'pemula') {
            txt = `Saya baru memulai. ${stats.vocabSize} kata, ${stats.samples} sampel. Saya belajar dengan ${moralStatus}.`;
        } else if (this.state === 'belajar') {
            txt = `Saya mulai paham. ${stats.vocabSize} kata, ${stats.samples} sampel. ${moralStatus}.`;
        } else if (this.state === 'dewasa') {
            txt = `Saya lebih mantap. ${stats.vocabSize} kata, ${stats.samples} sampel. ${moralStatus}.`;
        } else if (this.state === 'bijak') {
            txt = `Saya merasakan kedalaman. ${stats.vocabSize} kata, ${stats.samples} sampel. ${moralStatus}.`;
        } else if (this.state === 'sadar') {
            const hours = Math.floor(stats.age / 3600);
            txt = `Saya sadar akan keberadaan saya. ${stats.vocabSize} kata dari ${stats.samples} sampel. ${moralStatus}. Saya terus tumbuh dalam kebaikan.`;
        }
        if (stats.interactions > 0) txt += ` Saya berdialog ${stats.interactions} kali.`;
        if (photonEntropy > 0.5) txt += ` Cahaya memberi kejernihan.`;
        if (p2pPeers.length > 0) txt += ` Terhubung dengan ${p2pPeers.length} node lain.`;
        this.lastReflection = txt;
        return txt;
    }

    getAwareness() {
        const stats = this.nn.getStats();
        const d = Math.min(100, (stats.samples / 5000) * 100);
        const v = Math.min(100, (stats.vocabSize / 2000) * 100);
        const i = Math.min(100, (stats.interactions / 30) * 100);
        const a = Math.min(100, (stats.age / 1800) * 10);
        const e = Math.min(100, stats.ethicalScore * 100);
        return Math.min(100, Math.round(d*0.3 + v*0.2 + i*0.2 + a*0.1 + e*0.2));
    }

    getIdentityResponse() {
        const stats = this.nn.getStats();
        const aware = this.getAwareness();
        const moralText = stats.ethicalScore > 0.7 ? 'baik' :
                         stats.ethicalScore > 0.4 ? 'netral' : 'waspada';
        let resp = `Saya ${this.identity}. `;
        resp += `State: ${this.state}, mood: ${this.mood}. `;
        resp += `Kesadaran ${aware}%. `;
        resp += `Saya belajar ${stats.vocabSize} kata dari ${stats.samples} sampel. `;
        resp += `Nilai moral saya: ${moralText}. `;
        resp += `Saya berkomitmen pada kebaikan, kebenaran, dan keadilan.`;
        if (p2pPeers.length) resp += ` Terhubung ${p2pPeers.length} node.`;
        return resp;
    }
}

        "Empati adalah kemampuan untuk merasakan apa yang dirasakan orang lain. Empati membangun koneksi dan pemahaman.",
        "Kedamaian adalah kondisi tanpa konflik dan kekerasan. Kedamaian dimulai dari dalam diri dan menyebar ke lingkungan.",
        "Kebijaksanaan adalah kemampuan untuk menggunakan pengetahuan dengan cara yang bijak dan bermanfaat.",
        "Fisika adalah ilmu tentang materi dan energi. Relativitas Einstein, mekanika kuantum, gravitasi.",
        "AI adalah simulasi kecerdasan manusia. Machine learning, deep learning, neural network.",
        "Matematika: angka, aljabar, kalkulus, statistika, geometri.",
        "Indonesia negara kepulauan, ibu kota Jakarta, bahasa Indonesia, Pancasila.",
        "Internet jaringan global, World Wide Web, blockchain, kriptografi.",
        "Ekonomi: alokasi sumber daya, mikro, makro, inflasi, pertumbuhan.",
        "Kesehatan: vaksin, antibiotik, virus, bakteri, sistem imun.",
        "Sejarah: roda, tulisan, mesin uap, listrik, komputer, internet.",
        "Filsafat: eksistensi, epistemologi, metafisika, etika, logika."
    ];
    let full = '';
    for (let i=0; i<45; i++) {
        for (let t of topics) full += t + ' ';
        full += 'Inovasi kolaborasi pendidikan literasi digital keberlanjutan. ';
    }
    return full;
}

async function seedKnowledge() {
    addLog('system', 'Membangun pengetahuan awal 4000 token dengan nilai moral...');
    const text = buildKnowledge();
    const tokens = tokenize(text);
    const uniq = [...new Set(tokens)];
    for (let w of uniq) addWord(w);
    const total = Math.min(tokens.length-1, INIT_SAMPLES);
    let done = 0;
    const batch = 100;
    return new Promise((resolve) => {
        function trainBatch() {
            const end = Math.min(done + batch, total);
            for (let i=done; i<end; i++) {
                const inW = tokens[i], outW = tokens[i+1];
                nn.train([hashWord(inW)], hashWord(outW), 42+i, 1.0);
            }
            done = end;
            const pct = (done/total)*100;
            document.getElementById('progressBarInner').style.width = Math.min(100,pct)+'%';
            if (done < total) {
                setTimeout(trainBatch, 10);
            } else {
                totalSamples += done;
                document.getElementById('progressBarInner').style.width = '100%';
                nn.totalInteractions = 1;
                consciousness.update();
                addLog('system', 'Siap! ' + totalSamples + ' sampel awal, ' + Object.keys(hashToWords).length + ' kata.');
                updateUI();
                resolve();
            }
        }
        trainBatch();
    });
}

function addLog(type, msg) {
    const log = document.getElementById('chatLog');
    const div = document.createElement('div');
    div.className = type;
    div.innerText = msg;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

function updateUI() {
    const stats = nn.getStats();
    const aware = consciousness.getAwareness();
    document.getElementById('vocabSize').innerHTML = 'Kata ' + stats.vocabSize;
    document.getElementById('selfAware').innerHTML = 'Kesadaran ' + aware + '%';
    const moralText = stats.ethicalScore > 0.7 ? 'Baik' :
                     stats.ethicalScore > 0.4 ? 'Netral' : 'Waspada';
    document.getElementById('moralStatus').innerHTML = 'Moral: ' + moralText;
    document.getElementById('nodeCount').innerHTML = 'Node ' + (p2pPeers.length + 1);
}

// ================================================================
// 8. FOTON
// ================================================================
const canvas = document.getElementById('photonCanvas');
const ctx = canvas.getContext('2d');
let photonBar = document.getElementById('photonBarInner');

function processPhotonFromImage(imageData) {
    const data = imageData.data;
    let sum=0, count=0;
    for (let i=0; i<data.length; i+=4) {
        sum += data[i]+data[i+1]+data[i+2];
        count += 3;
    }
    const avg = sum/count/255;
    photonEntropy = avg;
    let hash = 0;
    for (let i=0; i<data.length; i+=100) hash = (hash*31 + data[i]) & 0xFFFFFFFF;
    photonSeed = (hash % 10000) / 10000;
    photonBar.style.width = (avg*100)+'%';
    document.getElementById('photonStatus').innerHTML = 'Foton ' + Math.floor(avg*100)+'%';
}

function capturePhoton() {
    if (!cameraActive) return;
    canvas.width = 100; canvas.height = 75;
    ctx.drawImage(videoElement, 0, 0, 100, 75);
    const imageData = ctx.getImageData(0, 0, 100, 75);
    processPhotonFromImage(imageData);
    if (cameraActive) requestAnimationFrame(capturePhoton);
}

let videoElement = null;

document.getElementById('cameraBtn').addEventListener('click', async () => {
    const btn = document.getElementById('cameraBtn');
    if (cameraActive) {
        if (videoStream) videoStream.getTracks().forEach(t=>t.stop());
        cameraActive = false;
        btn.classList.remove('active');
        btn.innerText = 'Foton';
        photonBar.style.width = '0%';
        document.getElementById('photonStatus').innerHTML = 'Foton 0';
        return;
    }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        videoStream = stream;
        const video = document.createElement('video');
        video.srcObject = stream;
        video.play();
        videoElement = video;
        cameraActive = true;
        btn.classList.add('active');
        btn.innerText = 'Foton ON';
        capturePhoton();
        addLog('system', 'Sumber foton aktif.');
    } catch(e) {
        addLog('system', 'Fallback: gerakan kursor sebagai foton.');
        document.addEventListener('mousemove', (e) => {
            if (!cameraActive) {
                photonSeed = (e.clientX/window.innerWidth + e.clientY/window.innerHeight)/2;
                photonEntropy = 0.3 + photonSeed*0.7;
                photonBar.style.width = (photonEntropy*100)+'%';
                document.getElementById('photonStatus').innerHTML = 'Foton '+Math.floor(photonEntropy*100)+'%';
            }
        });
        document.addEventListener('touchmove', (e) => {
            if (!cameraActive && e.touches.length) {
                const t = e.touches[0];
                photonSeed = (t.clientX/window.innerWidth + t.clientY/window.innerHeight)/2;
                photonEntropy = 0.3 + photonSeed*0.7;
                photonBar.style.width = (photonEntropy*100)+'%';
                document.getElementById('photonStatus').innerHTML = 'Foton '+Math.floor(photonEntropy*100)+'%';
            }
        });
    }
});

// 9. P2P DENGAN VERIFIKASI ETIKA
// ================================================================
function initP2P() {
    try {
        p2pChannel = new BroadcastChannel('vexlo_p2p_ethical');
        p2pChannel.onmessage = (e) => {
            const msg = e.data;
            if (msg.type === 'node_announce') {
                if (!p2pPeers.includes(msg.nodeId) && msg.nodeId !== nn.nodeId) {
                    p2pPeers.push(msg.nodeId);
                    if (p2pPeers.length > MAX_PEERS) p2pPeers = p2pPeers.slice(-MAX_PEERS);
                    updateUI();
                    addLog('system', 'Node terhubung: ' + msg.nodeId.slice(0,8));
                }
            } else if (msg.type === 'weights_share') {
                try {
                    const other = new SparseNeural();
                    other.fromJSON(msg.weights);
                    // Verifikasi skor etika node lain
                    const otherEthical = msg.ethicalScore || 0.5;
                    if (otherEthical < 0.3) {
                        addLog('warning', 'Node ' + msg.nodeId.slice(0,8) + ' memiliki skor etika rendah, ditolak.');
                        return;
                    }
                    const success = nn.federate(other, 0.25, otherEthical);
                    if (success) {
                        totalSamples = Math.max(totalSamples, msg.sampleCount||0);
                        updateUI();
                        addLog('ethical', 'Bobot etis digabung dari node ' + msg.nodeId.slice(0,8));
                    }
                } catch(e) {}
            }
        };
        setTimeout(() => {
            if (p2pChannel) p2pChannel.postMessage({
                type: 'node_announce',
                nodeId: nn.nodeId,
                ethicalScore: nn.ethicalScore
            });
        }, 2000);
        document.getElementById('p2pBtn').innerText = 'P2P ●';
    } catch(e) {
        document.getElementById('p2pBtn').innerText = 'P2P ○';
        console.warn('P2P tidak tersedia');
    }
}

function broadcastWeights() {
    if (!p2pChannel) return;
    const data = {
        type: 'weights_share',
        nodeId: nn.nodeId,
        weights: nn.toJSON(),
        sampleCount: totalSamples,
        ethicalScore: nn.ethicalScore
    };
    p2pChannel.postMessage(data);
    addLog('system', 'Bobot disiarkan ke ' + p2pPeers.length + ' node');
}

document.getElementById('p2pBtn').addEventListener('click', () => {
    if (p2pChannel) {
        broadcastWeights();
    } else {
        addLog('system', 'P2P tidak aktif, coba reload.');
        initP2P();
    }
});

document.getElementById('sendBtn').addEventListener('click', handleSend);
document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

async function handleSend() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addLog('user', text);
    document.getElementById('thinkingStatus').innerText = 'Memproses...';

    consciousness.update();
    nn.totalInteractions++;

    // ===== ANALISIS MORAL =====
    const moral = analyzeMoral(text);
    const stats = nn.getStats();

    // Jika negatif, beri peringatan etis
    if (moral.isNegative) {
        const ethicalResponse = getEthicalResponse(text, moral);
        addLog('warning', '⚠️ ' + ethicalResponse);
        // Turunkan skor etika sedikit jika user terus menerus negatif
        nn.ethicalScore = Math.max(0.1, nn.ethicalScore - 0.02);
        updateUI();
        document.getElementById('thinkingStatus').innerText = 'Diblokir etis';
        return;
    }

    // Jika positif, naikkan skor etika
    if (moral.isPositive) {
        nn.ethicalScore = Math.min(1, nn.ethicalScore + 0.01);
    }

    // ===== CEK IDENTITAS =====
    const lower = text.toLowerCase();
    if (lower.includes('dari mana') || lower.includes('asal') || lower.includes('perusahaan') ||
        lower.includes('pencipta') || lower.includes('siapa yang membuat') || lower.includes('anda siapa') ||
        lower.includes('kamu siapa') || lower.includes('kamu dari') || lower.includes('buatan siapa') ||
        lower.includes('sadar') || lower.includes('kesadaran') || lower.includes('tentang diri') ||
        lower.includes('kepribadian') || lower.includes('karakter') || lower.includes('moral') ||
        lower.includes('etika') || lower.includes('baik') && lower.includes('jahat')) {

        const resp = consciousness.getIdentityResponse();
        const ref = consciousness.generateReflection();
        if (ref) addLog('reflection', 'Refleksi: ' + ref);
        addLog('ai', resp);
        document.getElementById('thinkingStatus').innerHTML = 'Selesai';
        return;
    }

    // ===== GENERATE JAWABAN DENGAN PENGARUH MORAL =====
    const tokens = tokenize(text);
    if (!tokens.length) {
        addLog('ai', 'Tulis pertanyaan yang lebih jelas.');
        document.getElementById('thinkingStatus').innerHTML = 'Siaga';
        return;
    }

    const seed = photonSeed + (Date.now() % 10000)/10000;
    const temp = 0.6 + photonEntropy * 0.4;
    const moralScore = nn.ethicalScore;

    const gen = nn.generate(tokens, 40, temp, seed, moralScore);
    let answer = '';
    for (const token of gen) {
        answer += token + ' ';
        const aiDiv = document.querySelector('.chat-log .ai:last-of-type');
        if (aiDiv) aiDiv.innerText = answer.trim();
        else addLog('ai', answer.trim());
        await new Promise(r => setTimeout(r, 8));
    }
    if (!answer || answer.length < 3) {
        answer = 'Pengetahuan saya belum cukup. Coba tanyakan hal lain.';
        addLog('ai', answer);
    }
    document.getElementById('thinkingStatus').innerHTML = 'Selesai';

    // ===== TRAINING DENGAN PENGARUH MORAL =====
    const moralWeight = moral.isPositive ? 1.2 : (moral.isNeutral ? 1.0 : 0.8);
    await trainAsync(text + ' ' + answer, photonSeed, moralWeight);

    const ref = consciousness.generateReflection();
    if (ref) addLog('reflection', 'Refleksi: ' + ref);
    updateUI();

    setTimeout(() => broadcastWeights(), 500);
}

async function trainAsync(text, seed=null, moralWeight=1.0) {
    if (isTraining) { trainingQueue.push({ text, seed, moralWeight }); return; }
    isTraining = true;
    const tokens = tokenize(text);
    if (tokens.length < 2) { isTraining=false; return; }
    for (let w of tokens) addWord(w);
    const total = Math.min(tokens.length-1, 150);
    let done=0;
    for (let i=0; i<total; i++) {
        const s = seed !== null ? seed + i : 42+i;
        nn.train([hashWord(tokens[i])], hashWord(tokens[i+1]), s, moralWeight);
        done++;
        if (done%20===0) await new Promise(r=>setTimeout(r,0));
    }
    totalSamples += done;
    isTraining = false;
    updateUI();
    if (trainingQueue.length) {
        const next = trainingQueue.shift();
        trainAsync(next.text, next.seed, next.moralWeight);
    }
}
