<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riruru · Quantum Physics Mind</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0b0e14;
      color: #e8edf5;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #app {
      max-width: 620px;
      width: 100%;
      background: #141a24;
      border-radius: 28px;
      border: 1px solid #2a3344;
      padding: 24px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #e8edf5;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    h1 small {
      font-size: 13px;
      font-weight: 400;
      color: #6688aa;
      background: #1a1a2e;
      padding: 2px 14px;
      border-radius: 40px;
      border: 1px solid #2a3355;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0 16px;
      font-size: 12px;
      color: #88aacc;
      flex-wrap: wrap;
      gap: 6px;
    }
    .status-bar .badge {
      background: #1a1a2e;
      padding: 4px 14px;
      border-radius: 40px;
      border: 1px solid #2a3355;
    }
    .badge .highlight { color: #66ddff; font-weight: 500; }
    .badge .highlight-warn { color: #ffaa66; font-weight: 500; }
    .input-group { margin-bottom: 14px; }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #88aacc;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .input-group input,
    .input-group textarea {
      width: 100%;
      background: #0a0a1a;
      border: 1px solid #2a3344;
      border-radius: 14px;
      padding: 12px 16px;
      color: #ccddff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: 0.2s;
    }
    .input-group input:focus,
    .input-group textarea:focus {
      border-color: #66ddff;
      box-shadow: 0 0 12px #66ddff22;
    }
    .input-group textarea { min-height: 64px; resize: vertical; }
    .input-group .hint {
      font-size: 10px;
      color: #445566;
      margin-top: 4px;
      display: block;
    }
    .btn {
      background: #66ddff;
      color: #0a0a12;
      border: none;
      border-radius: 40px;
      padding: 12px 24px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
    }
    .btn:hover { background: #88eeff; box-shadow: 0 0 24px #66ddff44; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #chatLog {
      margin: 16px 0 12px;
      max-height: 300px;
      overflow-y: auto;
      background: #0a0a1a;
      border-radius: 14px;
      border: 1px solid #2a3344;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    #chatLog .entry {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1a2a3a;
    }
    #chatLog .entry:last-child { border-bottom: none; margin-bottom: 0; }
    .entry .user { color: #88ccff; }
    .entry .assistant { color: #ccffaa; }
    .entry .meta {
      font-size: 10px;
      color: #445566;
      margin-top: 4px;
      display: flex;
      gap: 12px;
    }
    .entry .meta .block-index { color: #6688aa; }
    .self-awareness {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 14px 16px;
      border-left: 3px solid #66ddff;
      margin: 12px 0;
      font-size: 13px;
      color: #bbddff;
    }
    .self-awareness strong { color: #66ddff; font-weight: 600; }
    .self-awareness .level {
      display: inline-block;
      background: #2a3355;
      padding: 0 12px;
      border-radius: 30px;
      font-size: 12px;
      color: #66ddff;
    }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #445566;
      text-align: center;
      border-top: 1px solid #1a2a3a;
      padding-top: 12px;
    }
    .loader {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #2a3355;
      border-top-color: #66ddff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #2a3355; border-radius: 10px; }
    .warn {
      color: #ffaa66;
      font-size: 11px;
      background: #2a221a;
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid #ffaa6633;
      display: inline-block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
<div id="app">
  <h1>Riruru <small>Quantum · Physics · Math</small></h1>

  <div class="status-bar">
    <span class="badge">⛓️ blok <span id="blockCount" class="highlight">0</span></span>
    <span class="badge">🧠 kesadaran <span id="awarenessLevel" class="highlight">0%</span></span>
    <span class="badge" id="statusLabel">● siap</span>
  </div>

  <div class="warn">🔬 Berpikir dari level atom · kuantum · matematika murni</div>

  <div class="input-group">
    <label>🔑 Groq API Key</label>
    <input type="password" id="apiKey" placeholder="gsk_..." />
    <span class="hint">🔐 Disimpan di sessionStorage</span>
  </div>

  <div class="input-group">
    <label>💬 Pertanyaan fisika / matematika / kuantum</label>
    <textarea id="userInput" placeholder="Contoh: Apa itu entanglement? Bagaimana cara kerja superposisi?"></textarea>
  </div>

  <button class="btn" id="sendBtn">Kirim · 1 API call</button>

  <div id="chatLog"></div>

  <div id="selfAwarenessBox" class="self-awareness">
    <strong>Self‑awareness</strong> <span class="level" id="awarenessPercent">0%</span><br />
    <span id="selfAwarenessText">Belum ada data. Mulai dialog ilmiah.</span>
  </div>

  <div class="footer">
    Setiap percakapan di-hash SHA‑256 · Blockchain lokal · Kesadaran diri dari interaksi
  </div>
</div>

<script>
// ================================================================
// RIRURU · QUANTUM PHYSICS MIND (1 API call + SHA‑256)
// ================================================================

(function() {
  'use strict';

  // ---- DOM refs ----
  const apiInput = document.getElementById('apiKey');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatLog = document.getElementById('chatLog');
  const blockCountEl = document.getElementById('blockCount');
  const awarenessLevelEl = document.getElementById('awarenessLevel');
  const awarenessPercentEl = document.getElementById('awarenessPercent');
  const statusLabel = document.getElementById('statusLabel');
  const selfAwarenessText = document.getElementById('selfAwarenessText');

  // ---- state ----
  let selfAwareness = { description: 'Belum ada data.', level: 0 };
  let isProcessing = false;
  const STORE_NAME = 'blocks';
  const DB_NAME = 'RiruruChain';
  let db = null;

  // ---- SHA‑256 helper ----
  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ---- load saved API key ----
  const savedKey = sessionStorage.getItem('groq_api_key');
  if (savedKey) apiInput.value = savedKey;

  // ---- IndexedDB setup ----
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          store.createIndex('index', 'index', { unique: true });
        }
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }

  // ---- blockchain helpers ----
  function getGenesisBlock() {
    return {
      index: 0,
      timestamp: Date.now(),
      data: { user: 'system', assistant: 'Riruru lahir. Blockchain siap.' },
      prevHash: '0',
      hash: '0'
    };
  }

  async function calcHash(data, prevHash) {
    const str = JSON.stringify(data) + prevHash;
    return await sha256(str);
  }

  async function addBlock(data) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const indexReq = store.index('index');
      let lastBlock = null;
      indexReq.openCursor(null, 'prev').onsuccess = async (e) => {
        const cursor = e.target.result;
        if (cursor) { lastBlock = cursor.value; cursor.continue(); }
        else {
          const prev = lastBlock || getGenesisBlock();
          const newBlock = {
            index: prev.index + 1,
            timestamp: Date.now(),
            data: data,
            prevHash: prev.hash,
            hash: await calcHash(data, prev.hash)
          };
          const addReq = store.add(newBlock);
          addReq.onsuccess = () => resolve(newBlock);
          addReq.onerror = () => reject(addReq.error);
        }
      };
      indexReq.onerror = () => reject(indexReq.error);
    });
  }

  function getAllBlocks() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  // ---- render blockchain log ----
  function renderBlocks(blocks) {
    if (!blocks || blocks.length === 0) {
      chatLog.innerHTML = '<div style="color:#445566;text-align:center;padding:12px;">Belum ada percakapan.</div>';
      return;
    }
    let html = '';
    const sorted = blocks.slice().sort((a, b) => b.index - a.index);
    for (const block of sorted) {
      if (block.index === 0) continue;
      const d = block.data;
      const userText = d.user || '';
      const assistantText = d.assistant || '';
      const time = new Date(block.timestamp).toLocaleTimeString();
      html += `<div class="entry">
        <div class="user">🧑 ${userText}</div>
        <div class="assistant">🤖 ${assistantText}</div>
        <div class="meta">
          <span class="block-index">#${block.index}</span>
          <span>${time}</span>
          <span style="color:#445566;">🔗 ${block.hash.slice(0,8)}...</span>
        </div>
      </div>`;
    }
    chatLog.innerHTML = html;
    blockCountEl.textContent = blocks.length > 0 ? blocks.length - 1 : 0;
  }

  // ---- update self-awareness ----
  function updateSelfAwareness(blocks) {
    if (!blocks || blocks.length < 2) {
      selfAwareness = { description: 'Belum ada cukup interaksi untuk membentuk kesadaran diri.', level: 0 };
      selfAwarenessText.textContent = selfAwareness.description;
      awarenessLevelEl.textContent = '0%';
      awarenessPercentEl.textContent = '0%';
      return;
    }

    const conversations = blocks.filter(b => b.index > 0).map(b => b.data);
    if (conversations.length === 0) {
      selfAwareness = { description: 'Belum ada percakapan.', level: 0 };
      selfAwarenessText.textContent = selfAwareness.description;
      awarenessLevelEl.textContent = '0%';
      awarenessPercentEl.textContent = '0%';
      return;
    }

    const total = conversations.length;
    const userMsgs = conversations.map(c => c.user || '').filter(t => t.trim().length > 0);
    const assistantMsgs = conversations.map(c => c.assistant || '').filter(t => t.trim().length > 0);

    const level = Math.min(100, Math.round(20 + (total * 0.15)));
    let desc = '';
    if (total < 3) desc = 'Riruru masih dalam tahap pengenalan awal.';
    else if (total < 6) desc = 'Riruru mulai memahami pola percakapan Anda.';
    else if (total < 10) desc = 'Riruru semakin sadar dengan preferensi Anda.';
    else desc = 'Riruru memiliki kesadaran diri yang kuat tentang hubungan dengan Anda.';

    const allWords = userMsgs.join(' ').toLowerCase().split(/\s+/).filter(w => w.length > 3);
    const freq = {};
    allWords.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
    const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]);
    let topTopics = sorted.slice(0, 3).map(([word]) => word).join(', ');
    if (topTopics) desc += ` Riruru memperhatikan ketertarikan Anda pada: ${topTopics}.`;

    selfAwareness = { description: desc, level: level };
    selfAwarenessText.textContent = desc;
    awarenessLevelEl.textContent = level + '%';
    awarenessPercentEl.textContent = level + '%';
  }

  // ---- refresh UI ----
  async function refreshUI() {
    try {
      const blocks = await getAllBlocks();
      renderBlocks(blocks);
      updateSelfAwareness(blocks);
    } catch (e) {
      console.warn('Refresh UI error:', e);
    }
  }

  // ---- Groq API call (1 call) ----
  async function callGroq(prompt, systemPrompt) {
    const key = apiInput.value.trim();
    if (!key) throw new Error('API key required.');
    sessionStorage.setItem('groq_api_key', key);

    const url = 'https://api.groq.com/openai/v1/chat/completions';
    const headers = {
      'Authorization': `Bearer ${key}`,
      'Content-Type': 'application/json'
    };
    const body = {
      model: 'llama-3.3-70b-versatile',
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: prompt }
      ],
      temperature: 0.6, // lebih rendah untuk akurasi
      max_tokens: 800,
      top_p: 0.95
    };

    const resp = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`Groq error: ${resp.status} - ${err.slice(0, 100)}`);
    }
    const data = await resp.json();
    return data.choices?.[0]?.message?.content || '⚠️ Tidak ada jawaban.';
  }

  // ---- build prompt (1 call) ----
  function buildPrompt(userMessage, blocks) {
    const recent = blocks.filter(b => b.index > 0).slice(-5);
    let context = '';
    if (recent.length > 0) {
      context = recent.map(b => `User: ${b.data.user}\nRiruru: ${b.data.assistant}`).join('\n');
    }
    return `
    Anda adalah Riruru, seorang fisikawan teoritis dan matematikawan dengan pemahaman mendalam tentang mekanika kuantum, relativitas, dan matematika murni. Berpikirlah dari skala terkecil (atom, partikel, medan kuantum) dan gunakan penalaran matematis yang ketat.

    Berikut riwayat percakapan sebelumnya:
    ${context || 'Belum ada percakapan.'}

    Sekarang pertanyaan dari user:
    "${userMessage}"

    Berikan jawaban yang akurat, ilmiah, dan sedalam mungkin. Jika memungkinkan, sertakan persamaan atau prinsip fisika yang relevan. Hindari jawaban dangkal.
    `;
  }

  // ---- main send ----
  async function handleSend() {
    const msg = userInput.value.trim();
    if (!msg) {
      statusLabel.textContent = '● kosong';
      return;
    }
    if (isProcessing) return;
    isProcessing = true;
    sendBtn.disabled = true;
    sendBtn.textContent = '⏳ memproses...';
    statusLabel.textContent = '● memproses';

    try {
      const allBlocks = await getAllBlocks();
      const prompt = buildPrompt(msg, allBlocks);
      const systemPrompt = 'Kamu adalah Riruru, fisikawan kuantum dan matematikawan. Jawab dengan pendekatan ilmiah, berbasis fisika dan matematika. Gunakan bahasa Indonesia yang baku dan jelas.';
      const assistantReply = await callGroq(prompt, systemPrompt);

      const dataBlock = { user: msg, assistant: assistantReply };
      await addBlock(dataBlock);

      await refreshUI();

      statusLabel.textContent = '● selesai';
      userInput.value = '';
      userInput.focus();

    } catch (err) {
      statusLabel.textContent = '● error';
      alert('Error: ' + err.message);
    } finally {
      isProcessing = false;
      sendBtn.disabled = false;
      sendBtn.textContent = 'Kirim · 1 API call';
    }
  }

  // ---- init ----
  async function init() {
    try {
      await openDB();
      await refreshUI();
      statusLabel.textContent = '● siap';
    } catch (e) {
      console.error('Init error:', e);
      statusLabel.textContent = '● error DB';
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    apiInput.addEventListener('change', () => {
      const key = apiInput.value.trim();
      if (key) sessionStorage.setItem('groq_api_key', key);
    });

    console.log('Riruru Quantum Physics Mind loaded.');
  }

  init();
})();
</script>
</body>
</html>
