const HASH_SIZE = 2048;
const HIDDEN_SIZE = 128;
const LR = 0.005;

let generator = null;
let isReady = false;

// ================================================================
// 3. HASH & VOCAB UNTUK TRAINING TAMBAHAN
// ================================================================
function hashWord(w) {
    let h1 = 0x811c9dc5;
    for (let i=0; i<w.length; i++) { h1 ^= w.charCodeAt(i); h1 = (h1*0x01000193)>>>0; }
    let h2 = 5381;
    for (let i=0; i<w.length; i++) { h2 = ((h2<<5)+h2)+w.charCodeAt(i); h2 = h2>>>0; }
    return (h1 ^ h2) % HASH_SIZE;
}
let hashToWords = {};
function addWord(w) {
    const h = hashWord(w);
    if (!hashToWords[h]) hashToWords[h] = [];
    if (!hashToWords[h].includes(w)) hashToWords[h].push(w);
}
function getWord(h) {
    const c = hashToWords[h] || [];
    if (!c.length) return null;
    return c[Math.floor(Math.random() * c.length)];
}
const seedText = `fisika adalah ilmu tentang materi dan energi. mekanika kuantum relativitas gravitasi. kecerdasan buatan machine learning deep learning. matematika aljabar kalkulus statistika. indonesia jakarta pancasila. internet blockchain kriptografi. ekonomi mikro makro. kesehatan vaksin antibiotik. sejarah roda mesin uap komputer. filsafat epistemologi metafisika etika. VEXLO.CORE prototipe AI desentralisasi open-source.`;
const seedTokens = seedText.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>1);
for (let w of seedTokens) addWord(w);

// ================================================================
// 4. SPARSE NEURAL (tambahan)
// ================================================================
class SparseNeural {
    constructor() {
        this.W1 = new Map(); this.b1 = new Float32Array(HIDDEN_SIZE);
        this.W2 = new Map(); this.b2 = new Float32Array(HASH_SIZE);
        this.sampleCount = 0; this.interactions = 0; this.birthTime = Date.now();
        for (let i=0; i<6; i++) {
            const r1 = Math.floor(Math.random()*HASH_SIZE);
            const r2 = Math.floor(Math.random()*HIDDEN_SIZE);
            this.W1.set(r1+','+r2, (Math.random()*2-1)*0.01);
        }
        for (let i=0; i<6; i++) {
            const r1 = Math.floor(Math.random()*HIDDEN_SIZE);
            const r2 = Math.floor(Math.random()*HASH_SIZE);
            this.W2.set(r1+','+r2, (Math.random()*2-1)*0.01);
        }
    }
    forward(inputIndices) {
        const hidden = new Float32Array(HIDDEN_SIZE);
        for (let j=0; j<HIDDEN_SIZE; j++) {
            let sum = this.b1[j];
            for (let idx of inputIndices) {
                const v = this.W1.get(idx+','+j);
                if (v !== undefined) sum += v;
            }
            hidden[j] = Math.max(0, sum);
        }
        const output = new Float32Array(HASH_SIZE);
        for (let k=0; k<HASH_SIZE; k++) {
            let sum = this.b2[k];
            for (let j=0; j<HIDDEN_SIZE; j++) {
                const v = this.W2.get(j+','+k);
                if (v !== undefined) sum += hidden[j] * v;
            }
            output[k] = sum;
        }
        const max = Math.max(...output);
        let expSum = 0;
        for (let k=0; k<HASH_SIZE; k++) { output[k] = Math.exp(output[k]-max); expSum += output[k]; }
        for (let k=0; k<HASH_SIZE; k++) output[k] /= expSum;
        return { hidden, output };
    }
    train(inputIndices, targetIndex, seed=null) {
        const { hidden, output } = this.forward(inputIndices);
        const dOut = new Float32Array(HASH_SIZE);
        for (let k=0; k<HASH_SIZE; k++) dOut[k] = output[k] - (k===targetIndex?1:0);
        for (let j=0; j<HIDDEN_SIZE; j++) {
            const hval = hidden[j];
            if (Math.abs(hval) < 1e-8) continue;
            for (let k=0; k<HASH_SIZE; k++) {
                const grad = LR * dOut[k] * hval;
                if (Math.abs(grad) < 1e-10) continue;
                const key = j+','+k;
                const old = this.W2.get(key) || 0;
                this.W2.set(key, old - grad);
            }
        }
        for (let k=0; k<HASH_SIZE; k++) this.b2[k] -= LR * dOut[k];
        const dHidden = new Float32Array(HIDDEN_SIZE);
        for (let j=0; j<HIDDEN_SIZE; j++) {
            let sum = 0;
            for (let k=0; k<HASH_SIZE; k++) {
                const v = this.W2.get(j+','+k);
                if (v !== undefined) sum += dOut[k] * v;
            }
            dHidden[j] = (hidden[j] > 0) ? sum : 0;
        }
        for (let idx of inputIndices) {
            for (let j=0; j<HIDDEN_SIZE; j++) {
                const grad = LR * dHidden[j];
                if (Math.abs(grad) < 1e-10) continue;
                const key = idx+','+j;
                const old = this.W1.get(key) || 0;
                this.W1.set(key, old - grad);
            }
        }
        for (let j=0; j<HIDDEN_SIZE; j++) this.b1[j] -= LR * dHidden[j];
        this.sampleCount++;
        if (this.sampleCount % 10 === 0) this.prune();
    }
    prune() {
        const t = 1e-6;
        for (let [k,v] of this.W1) if (Math.abs(v) < t) this.W1.delete(k);
        for (let [k,v] of this.W2) if (Math.abs(v) < t) this.W2.delete(k);
    }
    *generate(seedTokens, maxTokens=25, temp=0.8, seed=null) {
        if (!seedTokens.length) return;
        let result = seedTokens.slice();
        let current = seedTokens[seedTokens.length-1];
        let rng = seed !== null ? seededRandom(seed) : ()=>Math.random();
        for (let i=0; i<maxTokens; i++) {
            const idx = hashWord(current);
            const { output } = this.forward([idx]);
            let r = rng(), cum=0, nextIdx=0;
            for (let k=0; k<HASH_SIZE; k++) { cum += output[k]; if (r <= cum) { nextIdx=k; break; } }
            const nextWord = getWord(nextIdx);
            if (!nextWord) break;
            result.push(nextWord);
            current = nextWord;
            yield nextWord;
            if (['.', '?', '!'].includes(current)) break;
        }
    }
    toJSON() {
        return {
            W1: Object.fromEntries(this.W1),
            W2: Object.fromEntries(this.W2),
            b1: Array.from(this.b1),
            b2: Array.from(this.b2),
            sampleCount: this.sampleCount
        };
    }
    fromJSON(data) {
        this.W1 = new Map(Object.entries(data.W1||{}));
        this.W2 = new Map(Object.entries(data.W2||{}));
        this.b1 = new Float32Array(data.b1);
        this.b2 = new Float32Array(data.b2);
        this.sampleCount = data.sampleCount||0;
        this.prune();
    }
    getStats() {
        return {
            samples: this.sampleCount,
            interactions: this.interactions,
            vocab: Object.keys(hashToWords).length,
            age: Math.floor((Date.now()-this.birthTime)/1000)
        };
    }
}
function seededRandom(s) {
    return function(){ s=(s*9301+49297)%233280; return s/233280; };
}

function processPhotonFromImage(imageData) {

    for (let i=0; i<data.length; i+=4) {

        count += 3;

    const avg = sum/count/255;
    photonEntropy = avg;
    let hash = 0;
    for (let i=0; i<data.length; i+=100) hash = (hash*31 + data[i]) & 0xFFFFFFFF;
    photonSeed = (hash % 10000) / 10000;
    document.getElementById('photonBarInner').style.width = (avg*100)+'%';
    document.getElementById('photonStatus').innerHTML = '☀ '+Math.floor(avg*100)+'%';
}

async function scrapeURL(url) {
    try {
        const proxy = 'https://api.allorigins.win/raw?url=';
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 12000);
        const resp = await fetch(proxy + encodeURIComponent(url), { signal: controller.signal });
        clearTimeout(timeout);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const html = await resp.text();
        return html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').slice(0, 5000);
    } catch(e) {
        throw new Error('Gagal ambil: ' + e.message);
    }
}
async function searchWikipedia(query) {
    try {
        const searchUrl = `https://id.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
        const resp = await fetch(searchUrl);
        const data = await resp.json();
        if (data.query && data.query.search && data.query.search.length > 0) {
            const title = data.query.search[0].title;
            const contentUrl = `https://id.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(title)}&format=json&origin=*`;
            const resp2 = await fetch(contentUrl);
            const data2 = await resp2.json();
            if (data2.parse && data2.parse.text) {
                const html = data2.parse.text['*'];
                return html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').slice(0, 3000);
            }
        }
        return null;
    } catch(e) {
        return null;
    }
}

async function trainText(text, seed=null) {
    const tokens = tokenize(text);
    if (tokens.length < 2) return;
    for (let w of tokens) addWord(w);
    const total = Math.min(tokens.length-1, 30);
    for (let i=0; i<total; i++) {
        nn.train([hashWord(tokens[i])], hashWord(tokens[i+1]), seed ? seed + i : null);
        if (i % 10 === 0) await new Promise(r => setTimeout(r, 0));
    }
}

async function generateGPT(prompt, context='') {
    if (!generator) return 'Model belum siap.';
    try {
        const fullPrompt = context ? `Pertanyaan: ${prompt}\nInformasi: ${context}\nJawaban:` : `Pertanyaan: ${prompt}\nJawaban:`;
        const result = await generator(fullPrompt, {
            max_new_tokens: 60,
            temperature: 0.8,
            do_sample: true,
            top_p: 0.9,
        });
        let text = result[0].generated_text;
        if (text.startsWith(fullPrompt)) text = text.slice(fullPrompt.length).trim();
        if (!text) text = 'Maaf, saya tidak bisa menjawab.';
        return text;
    } catch(e) {
        console.error(e);
        return 'Error: ' + e.message;
    }
}

// ================================================================
// 9. GENERATE CoT + GPT (Chain of Thought dulu)
// ================================================================
async function generateWithCoT(prompt, context='') {
    // Buat CoT sederhana
    const cotPrompt = 'Saya akan merenungkan pertanyaan ini: ' + prompt;
    const genCot = await generateGPT(cotPrompt, context);
    addLog('cot', genCot);

    // Jawaban final
    const answer = await generateGPT(prompt, context);
    return answer;
}

// ================================================================
// 10. CHAT HANDLER
// ================================================================
document.getElementById('sendBtn').addEventListener('click', handleSend);
document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

async function handleSend() {
    if (isProcessing || !isReady) return;
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addLog('user', text);
    isProcessing = true;
    updateUI();

    // IDENTITAS VEXLO
    const lower = text.toLowerCase();
    if (lower.includes('dari mana') || lower.includes('asal') || lower.includes('perusahaan') ||
        lower.includes('pencipta') || lower.includes('siapa yang membuat') || lower.includes('kamu siapa') ||
        lower.includes('kamu itu apa') || lower.includes('anda siapa')) {
        const identityAnswer = `Saya VEXLO.CORE, prototipe kecerdasan buatan desentralisasi yang dikembangkan secara independen oleh komunitas open-source. Saya tidak berasal dari perusahaan besar atau korporasi. Tujuan saya adalah membantu pemahaman dengan kepekaan dan kebijaksanaan.`;
        addLog('ai', identityAnswer);
        isProcessing = false;
        updateUI();
        return;
    }

    // AUTO WIKIPEDIA
    let webContext = '';
    if (text.split(' ').length > 2) {
        addLog('system', '🔍 Mencari di Wikipedia...');
        const wikiText = await searchWikipedia(text);
        if (wikiText && wikiText.length > 100) {
            webContext = wikiText.slice(0, 2000);
            addLog('scrape-result', '📄 Ditemukan informasi dari Wikipedia.');
            await trainText(webContext, photonSeed + 0.5);
        } else {
            addLog('system', 'Tidak ditemukan di Wikipedia.');
        }
    }

    // GENERATE DENGAN CoT + GPT
    addLog('system', '🧠 Memikirkan jawaban...');
    const answer = await generateWithCoT(text, webContext);
    addLog('ai', answer);

    // TRAINING TAMBAHAN
    setTimeout(() => {
        const allText = text + ' ' + answer + (webContext ? ' ' + webContext.slice(0, 500) : '');
        const trainTokens = tokenize(allText);
        if (trainTokens.length > 1) {
            for (let w of trainTokens) addWord(w);
            for (let i=0; i<Math.min(trainTokens.length-1, 8); i++) {
                nn.train([hashWord(trainTokens[i])], hashWord(trainTokens[i+1]), photonSeed + i);
            }
        }
        chain.push({ user: text, ai: answer, ts: Date.now() });
        if (chain.length > 20) chain = chain.slice(-20);
        try { localStorage.setItem('vexlo_chain_smart', JSON.stringify(chain)); } catch(e) {}
        consciousness.update();
        updateUI();
        const ref = consciousness.generateReflection();
        if (ref) addLog('reflection', ref);
    }, 10);

    isProcessing = false;
    updateUI();
}

// ================================================================
// 11. SCRAPE & SEARCH MANUAL
// ================================================================
document.getElementById('scrapeBtn').addEventListener('click', async () => {
    if (isProcessing) return;
    const input = document.getElementById('scrapeInput');
    const url = input.value.trim();
    if (!url) { alert('Masukkan URL'); return; }
    isProcessing = true;
    updateUI();
    addLog('system', '⏳ Scraping...');
    try {
        const text = await scrapeURL(url);
        if (text.length < 50) throw new Error('Teks terlalu pendek');
        addLog('scrape-result', '📄 Berhasil scrape ' + text.split(' ').length + ' kata');
        await trainText(text, photonSeed);
        addLog('system', '✅ Training selesai.');
    } catch(e) {
        addLog('system', '❌ ' + e.message);
    }
    isProcessing = false;
    updateUI();
});

document.getElementById('searchBtn').addEventListener('click', async () => {
    if (isProcessing) return;
    const input = document.getElementById('scrapeInput');
    const query = input.value.trim();
    if (!query) { alert('Masukkan keyword'); return; }
    isProcessing = true;
    updateUI();
    addLog('system', '🔍 Mencari di Wikipedia...');
    const text = await searchWikipedia(query);
    if (text && text.length > 100) {
        addLog('scrape-result', '📄 Ditemukan ' + text.split(' ').length + ' kata');
        await trainText(text, photonSeed + 0.5);
        addLog('system', '✅ Training selesai.');
    } else {
        addLog('system', '❌ Tidak ditemukan.');
    }
    isProcessing = false;
    updateUI();
});

async function loadModel() {
    try {
        document.getElementById('modelStatus').innerHTML = '⏳ Download DistilGPT2...';
        document.getElementById('progressBarInner').style.width = '10%';
        generator = await pipeline('text-generation', 'Xenova/distilgpt2');
        document.getElementById('progressBarInner').style.width = '100%';
        document.getElementById('modelStatus').innerHTML = '✅ Siap';
        isReady = true;
        document.getElementById('chatInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('chatInput').focus();
        addLog('system', '✅ Model DistilGPT2 siap! Sekarang AI pintar.');
        updateUI();
    } catch(e) {
        document.getElementById('modelStatus').innerHTML = '❌ Gagal';
        addLog('system', '❌ Gagal memuat model: ' + e.message);
    }
}

try {
    const saved = localStorage.getItem('vexlo_chain_smart');
    if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length) {
            chain = parsed;
            document.getElementById('blockCount').innerHTML = 'Blok '+chain.length;
        }
    }
} catch(e) {}

setInterval(() => {
    consciousness.update();
    const ref = consciousness.generateReflection();
    if (ref) addLog('reflection', ref);
    updateUI();
}, 25000);

document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('Reset semua data? Tidak bisa dibatalkan.')) {
        localStorage.removeItem('vexlo_chain_smart');
        location.reload();
    }
});

document.getElementById('photonBarInner').style.width = '30%';
document.getElementById('photonStatus').innerHTML = '☀ 30%';
addLog('system', '✦ Memuat model DistilGPT2 (82M) ... tunggu 1-2 menit.');
loadModel();
