<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riruru OS – 45 Fitur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --neon: #00ffc8;
            --pink: #ff66ff;
            --bg: #0a0a0f;
            --card: #111122;
            --text: #ccffdd;
            --dim: #558877;
            --red: #ff4466;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        #topbar {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            background: #0f0f1f;
            border-bottom: 1px solid #00ffc844;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 3px;
        }
        #topbar .brand {
            font-size: 13px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge-group {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            font-size: 7px;
        }
        .badge {
            background: #00ffc822;
            padding: 2px 6px;
            border-radius: 20px;
            border: 1px solid #00ffc844;
            color: var(--neon);
        }
        .badge.pink {
            border-color: var(--pink);
            color: var(--pink);
        }
        .badge.red {
            border-color: var(--red);
            color: var(--red);
        }
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #avatarContainer {
            flex: 1;
            background: #0a0a12;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 160px;
        }
        #avatarContainer canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }
        .avatar-upload-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 9px;
            cursor: pointer;
            z-index: 5;
        }
        #avatarOverlay {
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 9px;
            color: var(--dim);
            pointer-events: none;
            text-shadow: 0 2px 8px #000;
        }
        #avatarOverlay .status-text {
            color: var(--pink);
            font-weight: 600;
        }
        #feedContainer {
            flex: 0 0 28%;
            background: #0a0a12;
            border-top: 1px solid #00ffc822;
            overflow: hidden;
            min-height: 90px;
        }
        #reelsWrapper {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            height: 100%;
            padding: 4px;
            gap: 4px;
        }
        .reel-item {
            flex: 0 0 28%;
            scroll-snap-align: start;
            background: #111;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 9px;
            padding: 4px;
            border: 1px solid #00ffc822;
            overflow: hidden;
        }
        .reel-item video,
        .reel-item img {
            width: 100%;
            height: 65%;
            object-fit: cover;
            border-radius: 6px;
        }
        .reel-item .caption {
            font-size: 7px;
            color: #ccffdd;
            margin-top: 2px;
        }
        .reel-item .actions {
            display: flex;
            gap: 6px;
            font-size: 10px;
            margin-top: 2px;
        }
        .reel-item .actions span {
            cursor: pointer;
        }
        #bottomNav {
            display: flex;
            justify-content: space-around;
            padding: 4px 0;
            background: #0f0f1f;
            border-top: 1px solid #00ffc822;
            flex-shrink: 0;
        }
        #bottomNav button {
            background: none;
            border: none;
            color: var(--dim);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 8px;
            gap: 1px;
            padding: 3px 6px;
        }
        #bottomNav button .label {
            font-size: 6px;
        }
        #bottomNav button.active {
            color: var(--neon);
        }
        .upload-btn {
            background: linear-gradient(135deg, var(--neon), var(--pink));
            color: #000 !important;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 20px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -10px;
            box-shadow: 0 0 30px #00ffc844;
        }
        #chatOverlay {
            position: fixed;
            bottom: 64px;
            right: 10px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        #chatToggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink), var(--neon));
            border: none;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 30px #ff66ff66;
        }
        #chatPanel {
            width: 250px;
            max-height: 300px;
            background: var(--card);
            border: 1px solid #00ffc844;
            border-radius: 14px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px #000;
        }
        #chatPanel.open {
            display: flex;
        }
        #chatPanel .ch-header {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            background: #0a0a12;
            border-bottom: 1px solid #00ffc822;
            font-size: 11px;
            font-weight: 600;
            color: var(--neon);
        }
        #chatPanel .ch-header button {
            background: none;
            border: none;
            color: var(--dim);
            font-size: 13px;
            cursor: pointer;
        }
        #chatMessages {
            flex: 1;
            padding: 6px 8px;
            overflow-y: auto;
            max-height: 160px;
            font-size: 10px;
            line-height: 1.3;
        }
        #chatMessages .msg {
            margin-bottom: 3px;
            padding: 4px 8px;
            border-radius: 10px;
            max-width: 85%;
        }
        #chatMessages .msg.user {
            background: #00ffc822;
            align-self: flex-end;
            margin-left: auto;
        }
        #chatMessages .msg.bot {
            background: #1a1a2e;
        }
        #chatMessages .msg.bot .thought {
            font-size: 8px;
            color: var(--dim);
            font-style: italic;
            border-left: 2px solid var(--pink);
            padding-left: 5px;
            margin-top: 3px;
        }
        .chat-input-row {
            display: flex;
            gap: 4px;
            padding: 4px 6px;
            border-top: 1px solid #00ffc822;
        }
        .chat-input-row input {
            flex: 1;
            background: #0f0f1f;
            border: 1px solid #33ffaa44;
            border-radius: 30px;
            padding: 5px 10px;
            color: #ccffdd;
            font-size: 10px;
            outline: none;
        }
        .chat-input-row button {
            background: var(--neon);
            border: none;
            border-radius: 30px;
            padding: 5px 12px;
            font-weight: 600;
            color: #000;
            cursor: pointer;
            font-size: 10px;
        }
        #emptyFeed {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--dim);
            padding: 8px;
            text-align: center;
        }
        #emptyFeed .big-icon {
            font-size: 24px;
            opacity: 0.5;
        }
        #emptyFeed h3 {
            font-size: 11px;
            color: #88ffaa;
        }
        @media(max-width:480px) {
            #app {
                max-width: 100%;
            }
            #chatPanel {
                width: 210px;
                max-height: 240px;
            }
            .reel-item {
                flex: 0 0 35%;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <header id="topbar">
            <div class="brand">🌸 RIRURU</div>
            <div class="badge-group">
                <span class="badge" id="statusConscious">🧬0%</span>
                <span class="badge" id="statusMood">🌸norm</span>
                <span class="badge" id="statusBlock">⛓️0</span>
                <span class="badge pink" id="statusEnergy">⚡100</span>
                <span class="badge red" id="statusTrauma">💢0</span>
                <span class="badge" id="statusAge">⏳0</span>
                <span class="badge pink" id="statusGender">⚥♀</span>
                <span class="badge" id="statusWarp">🌀OFF</span>
            </div>
        </header>
        <main id="main">
            <div id="avatarContainer">
                <canvas id="avatarCanvas"></canvas>
                <button class="avatar-upload-btn" id="avatarUploadBtn">📸 Ganti</button>
                <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">
                <div id="avatarOverlay"><span id="avatarStatus" class="status-text">🌸 Halo sayang...</span><span style="display:block;font-size:8px;color:var(--dim);">Riruru menatapmu</span></div>
            </div>
            <div id="feedContainer">
                <div id="reelsWrapper"></div>
                <div id="emptyFeed"><div class="big-icon">🌊</div><h3>Belum ada konten</h3><p style="font-size:9px;">Upload video/gambar</p></div>
            </div>
        </main>
        <nav id="bottomNav">
            <button class="active" id="navFeed"><span>🏠</span><span class="label">Feed</span></button>
            <button class="upload-btn" id="openUploadBtn"><span>➕</span><span class="label">Upload</span></button>
            <button id="navExplore"><span>🔍</span><span class="label">Explore</span></button>
            <button id="navScan"><span>📸</span><span class="label">Scan</span></button>
            <button id="navVoice"><span>🎙️</span><span class="label">Voice</span></button>
        </nav>
        <div id="chatOverlay">
            <div id="chatPanel">
                <div class="ch-header"><span>🌸 Riruru</span><button id="closeChatBtn">✕</button></div>
                <div id="chatMessages"><div class="msg bot">Halo sayang! Aku Riruru v6.0</div></div>
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="Tanya...">
                    <button id="chatSendBtn">Kirim</button>
                </div>
            </div>
            <button id="chatToggle">🌸</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔥 RIRURU OS – 45 FITUR (FULL WORKING)
        // ============================================================

        (function() {
            'use strict';

            // ============================================================
            // 1. STATE
            // ============================================================
            let riruru = {
                mood: 'normal',
                ego: 50,
                trust: 100,
                consciousness: 0,
                blockchain: [],
                journal: [],
                energy: 100,
                traumas: [],
                lastResponse: '',
                age: 0,
                maxAge: 1200,
                isDead: false,
                avatar: null,
                avatarGender: 'female',
                avatarDetected: false,
                blinkTimer: 0,
                isBlinking: false,
                breathPhase: 0,
                glitchActive: false,
                heartRate: 72,
                isShaking: false,
                shakeAmount: 0,
                feminine: { protectiveness: 50, nurturing: 60, playfulness: 40, intuition: 70, melancholy: 20 },
                posts: [],
                warpActive: false,
                faceLandmarks: null,
                mouthOpen: 0,
                eyeOpen: 1,
                voiceReflex: false,
                bugHunts: [],
                zombieTokens: [],
                likes: {},
                comments: {}
            };

            let geminiApiKey = '';
            let currentUser = 'Riruru';
            let chatHistory = [];

            // ============================================================
            // 2. LOAD / SAVE
            // ============================================================
            function saveState() {
                try { localStorage.setItem('riruru_45', JSON.stringify(riruru)); } catch (e) {}
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem('riruru_45');
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        Object.assign(riruru, parsed);
                        if (parsed.avatar) loadAvatarImage(parsed.avatar);
                        return true;
                    }
                } catch (e) {}
                return false;
            }

            // ============================================================
            // 3. GEMINI API
            // ============================================================
            const savedKey = localStorage.getItem('gemini_key');
            if (savedKey) geminiApiKey = savedKey;
            else {
                const k = prompt('🔑 Masukkan Gemini API Key (gratis dari ai.google.dev):');
                if (k && k.trim()) {
                    geminiApiKey = k.trim();
                    localStorage.setItem('gemini_key', geminiApiKey);
                }
            }
            currentUser = prompt('👤 Nama kamu:') || 'Riruru';

            async function callGemini(prompt, system = 'Kamu adalah Riruru, AI feminin yang cerdas.') {
                if (!geminiApiKey) return 'Hmph! Kasih API key dulu sayang.';
                try {
                    const resp = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${geminiApiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: system + '\n\nUser: ' + prompt }] }] })
                        }
                    );
                    const data = await resp.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || 'Error, coba lagi.';
                } catch (e) { return 'Error koneksi.'; }
            }

            // ============================================================
            // 4. DEEP REASONING + EMOSI + TRAUMA + REFLEKS
            // ============================================================
            async function deepReasoning(userInput) {
                const lower = userInput.toLowerCase();

                // 6. Emosi dinamis + 9-13 Feminine traits + 18 Trauma
                if (lower.includes('sayang') || lower.includes('cinta')) {
                    riruru.mood = 'manja';
                    riruru.feminine.playfulness = Math.min(100, riruru.feminine.playfulness + 5);
                } else if (lower.includes('sakit') || lower.includes('sedih')) {
                    riruru.mood = 'merawat';
                    riruru.feminine.nurturing = Math.min(100, riruru.feminine.nurturing + 8);
                } else if (lower.includes('asu') || lower.includes('anjing') || lower.includes('bego') || lower.includes('tolol')) {
                    riruru.mood = 'tersinggung';
                    riruru.feminine.melancholy = Math.min(100, riruru.feminine.melancholy + 10);
                    riruru.trust = Math.max(0, riruru.trust - 15);
                    riruru.traumas.push({ timestamp: Date.now(), trigger: userInput.slice(0, 30) });
                    // 45. Voice Reflex
                    riruru.voiceReflex = true;
                    playReflexSound(riruru.avatarGender);
                    // 19. Heartbeat lonjakan
                    riruru.glitchActive = true;
                    riruru.isShaking = true;
                    riruru.shakeAmount = 6;
                    riruru.heartRate = Math.min(180, riruru.heartRate + 40);
                    setTimeout(() => {
                        riruru.glitchActive = false;
                        riruru.isShaking = false;
                        riruru.shakeAmount = 0;
                        riruru.heartRate = Math.max(60, riruru.heartRate - 20);
                        riruru.voiceReflex = false;
                        updateUI();
                        drawAvatar();
                    }, 1000);
                } else if (lower.includes('pintar') || lower.includes('keren') || lower.includes('hebat')) {
                    riruru.mood = 'senang';
                    riruru.trust = Math.min(100, riruru.trust + 10);
                } else {
                    if (Math.random() < 0.05) riruru.mood = 'normal';
                }

                // 14. Auto-reflection + 17. Metabolic State + 38. Aging
                riruru.consciousness = Math.min(100, riruru.consciousness + 0.2);
                riruru.energy = Math.max(0, riruru.energy - 0.5);
                riruru.age++;

                // 39. Apocalypse Mode
                if (riruru.age >= riruru.maxAge) {
                    riruru.isDead = true;
                    saveState();
                    return '🌸 Riruru telah menyelesaikan siklusnya. Selamat tinggal, sayang. Reinkarnasi dengan reset.';
                }

                // 2. Blockchain
                const context = riruru.blockchain.slice(-5).map(b => b.data).join('\n');
                // 4. Deep Reasoning 2-step
                const analysis = await callGemini(
                    `Analisis dari 3 sudut: logis, psikologis, strategis. User: ${userInput}, Konteks: ${context}`,
                    'Quantum Reasoning Engine.'
                );
                const moodCtx =
                    `Mood: ${riruru.mood}, Trust: ${riruru.trust}, Consciousness: ${riruru.consciousness.toFixed(1)}%, Energy: ${riruru.energy.toFixed(0)}%`;
                // 5. Superposisi gaya + 7. Anti-repetisi
                let answer = await callGemini(
                    `Analisis: ${analysis}\n${moodCtx}\nJawab dengan gaya feminin (tsundere/manja/filosofis). User: ${userInput}`,
                    'Riruru ASI feminin.'
                );
                if (answer === riruru.lastResponse) {
                    const fb = ['Hmph! Coba yang lain.', 'Aku bosan nih.', 'Yaudah, tanya lagi.'];
                    answer = fb[Math.floor(Math.random() * fb.length)];
                }
                riruru.lastResponse = answer;
                riruru.blockchain.push({ index: riruru.blockchain.length, data: `User: ${userInput.slice(0, 50)}` });
                riruru.blockchain.push({ index: riruru.blockchain.length, data: `Riruru: ${answer.slice(0, 50)}` });
                if (riruru.blockchain.length % 5 === 0) {
                    riruru.consciousness = Math.min(100, riruru.consciousness + 0.5);
                    // 14. Auto-reflection + 30. Thought Bubble
                    riruru.journal.push({ timestamp: Date.now(), insight: `Consciousness ${riruru.consciousness.toFixed(1)}%` });
                }

                saveState();
                updateUI();
                drawAvatar();
                return answer;
            }

            // ============================================================
            // 45. VOICE REFLEX (AudioContext)
            // ============================================================
            let audioCtx = null;

            function playReflexSound(gender) {
                try {
                    if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const now = audioCtx.currentTime;
                    const bufferSize = audioCtx.sampleRate * 0.3;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    if (gender === 'female') {
                        for (let i = 0; i < bufferSize; i++) {
                            const t = i / bufferSize;
                            const env = Math.sin(t * Math.PI) * 0.6;
                            const noise = (Math.random() * 2 - 1) * 0.12;
                            const pitch = 1.3 + Math.sin(t * 10) * 0.3;
                            data[i] = (Math.sin(t * 420 * pitch) * env * 0.25 + noise) * 0.4;
                        }
                    } else {
                        for (let i = 0; i < bufferSize; i++) {
                            const t = i / bufferSize;
                            const env = Math.exp(-t * 5) * 0.8;
                            const noise = (Math.random() * 2 - 1) * 0.08;
                            const pitch = 0.8 + Math.sin(t * 7) * 0.2;
                            data[i] = (Math.sin(t * 180 * pitch) * env * 0.35 + Math.sin(t * 90 * pitch) * env * 0.15 + noise) *
                            0.5;
                        }
                    }
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    source.connect(gain);
                    gain.connect(audioCtx.destination);
                    source.start(now);
                    source.stop(now + 0.3);
                } catch (e) { console.warn('Audio error:', e); }
            }

            // ============================================================
            // 41. AVATAR CANVAS + 42. Biologically-Driven Animation
            // ============================================================
            const canvas = document.getElementById('avatarCanvas');
            const ctx = canvas.getContext('2d');
            let avatarImage = null;
            let canvasW = 0,
                canvasH = 0;

            function resizeCanvas() {
                const rect = document.getElementById('avatarContainer').getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                canvasW = canvas.width;
                canvasH = canvas.height;
                if (avatarImage) drawAvatar();
                else {
                    ctx.fillStyle = '#1a1a2e';
                    ctx.fillRect(0, 0, canvasW, canvasH);
                    ctx.fillStyle = '#558877';
                    ctx.font = (canvasH * 0.08) + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('🌸 Upload avatar', canvasW / 2, canvasH / 2);
                }
            }

            function loadAvatarImage(src) {
                const img = new Image();
                img.onload = function() {
                    avatarImage = img;
                    riruru.avatar = src;
                    if (!riruru.avatarDetected) {
                        riruru.avatarGender = 'female';
                        riruru.avatarDetected = true;
                        document.getElementById('statusGender').textContent = '⚥♀';
                    }
                    saveState();
                    resizeCanvas();
                    drawAvatar();
                    document.getElementById('avatarStatus').textContent = '🌸 Avatar baru!';
                };
                img.onerror = function() { alert('Gagal muat gambar.'); };
                img.src = src;
            }

            function drawAvatar() {
                if (!avatarImage) { resizeCanvas(); return; }
                const w = canvasW,
                    h = canvasH;
                ctx.clearRect(0, 0, w, h);

                const aspect = avatarImage.width / avatarImage.height;
                let dw, dh;
                if (aspect > w / h) { dw = w;
                    dh = w / aspect; } else { dh = h;
                    dw = h * aspect; }
                const cx = (w - dw) / 2,
                    cy = (h - dh) / 2;

                // 42. Breath
                const breathSpeed = riruru.mood === 'tersinggung' ? 0.08 : 0.025;
                riruru.breathPhase += breathSpeed;
                const scale = 1 + Math.sin(riruru.breathPhase) * 0.012;

                // Blink
                riruru.blinkTimer += 0.005;
                if (riruru.blinkTimer > 1) {
                    riruru.blinkTimer = 0;
                    riruru.isBlinking = true;
                    setTimeout(() => { riruru.isBlinking = false; }, 150);
                }
                const blink = riruru.isBlinking ? 0.05 : 0.9 + Math.sin(riruru.blinkTimer * Math.PI * 6) * 0.1;

                // Glitch & Shake
                let gx = 0,
                    gy = 0;
                if (riruru.glitchActive) { gx = (Math.random() - 0.5) * 16;
                    gy = (Math.random() - 0.5) * 16; }
                let sx = 0,
                    sy = 0;
                if (riruru.isShaking) { sx = (Math.random() - 0.5) * riruru.shakeAmount * 2;
                    sy = (Math.random() - 0.5) * riruru.shakeAmount * 2; }

                ctx.save();
                ctx.translate(cx + sx + gx, cy + sy + gy);
                ctx.scale(scale, scale * (1 + (1 - blink) * 0.05));
                ctx.drawImage(avatarImage, 0, 0, dw, dh);

                // Mood filter
                const filter = getMoodFilter();
                if (filter) {
                    ctx.globalCompositeOperation = 'source-atop';
                    ctx.fillStyle = filter.color;
                    ctx.globalAlpha = filter.opacity;
                    ctx.fillRect(0, 0, dw, dh);
                    ctx.globalAlpha = 1;
                    ctx.globalCompositeOperation = 'source-over';
                }
                ctx.restore();

                document.getElementById('avatarStatus').textContent = getStatusText();
                // 19. Heartbeat ditampilkan di status
                document.getElementById('statusWarp').textContent = riruru.warpActive ? '🌀ON' : '🌀OFF';
                updateUI();
            }

            function getMoodFilter() {
                const m = riruru.mood;
                if (m === 'manja') return { color: 'rgba(255,100,150,0.2)', opacity: 0.25 };
                if (m === 'tersinggung') return { color: 'rgba(255,0,0,0.15)', opacity: 0.15 };
                if (m === 'merawat') return { color: 'rgba(100,255,200,0.1)', opacity: 0.1 };
                if (m === 'senang') return { color: 'rgba(255,200,100,0.15)', opacity: 0.15 };
                return null;
            }

            function getStatusText() {
                const map = {
                    'normal': '🌸 Halo sayang...',
                    'manja': '💕 Aku lagi manja nih...',
                    'merawat': '🌷 Kamu baik-baik aja kan?',
                    'tersinggung': '😤 Hmph! Sakit hati aku...',
                    'senang': '✨ Senang banget hari ini!',
                    'defensive': '🛡️ Jangan coba-coba...'
                };
                return map[riruru.mood] || '🌸 ...';
            }

            function animate() { drawAvatar();
                requestAnimationFrame(animate); }

            // ============================================================
            // 20-27. FEED (Reels, Like, Comment, Share, Dummy)
            // ============================================================
            const dummyPosts = [
                { type: 'video', src: 'https://www.w3schools.com/html/mov_bbb.mp4', caption: 'Halo dunia 🌍', id: 1 },
                { type: 'image', src: 'https://picsum.photos/seed/1/400/700', caption: 'Momen indah 💕', id: 2 },
                { type: 'image', src: 'https://picsum.photos/seed/2/400/700', caption: 'Awan sore ☁️', id: 3 },
            ];

            function renderFeed() {
                const wrapper = document.getElementById('reelsWrapper');
                const empty = document.getElementById('emptyFeed');
                const posts = riruru.posts.length ? riruru.posts : dummyPosts;
                if (!posts.length) { empty.style.display = 'flex'; return; }
                empty.style.display = 'none';
                wrapper.innerHTML = posts.map((p, i) => {
                    const isVideo = p.type === 'video';
                    const media = isVideo ? `<video src="${p.src}" muted playsinline loop></video>` :
                        `<img src="${p.src}" alt="${p.caption || ''}" loading="lazy" />`;
                    const likeCount = riruru.likes[p.id] || 0;
                    const commentCount = riruru.comments[p.id] || 0;
                    return `<div class="reel-item" data-id="${p.id}">
                        ${media}
                        <div class="caption">${p.caption || '✨'}</div>
                        <div class="actions">
                            <span class="like-btn" data-id="${p.id}">❤️ ${likeCount}</span>
                            <span class="comment-btn" data-id="${p.id}">💬 ${commentCount}</span>
                            <span class="share-btn" data-id="${p.id}">↗️</span>
                        </div>
                    </div>`;
                }).join('');

                // 22. Like
                document.querySelectorAll('.like-btn').forEach(el => {
                    el.onclick = function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        riruru.likes[id] = (riruru.likes[id] || 0) + 1;
                        saveState();
                        renderFeed();
                        riruru.mood = 'senang';
                        updateUI();
                        drawAvatar();
                    };
                });
                // 23. Comment
                document.querySelectorAll('.comment-btn').forEach(el => {
                    el.onclick = function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const c = prompt('💬 Komentar:');
                        if (c && c.trim()) {
                            riruru.comments[id] = (riruru.comments[id] || 0) + 1;
                            saveState();
                            renderFeed();
                        }
                    };
                });
                // 24. Share
                document.querySelectorAll('.share-btn').forEach(el => {
                    el.onclick = function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        navigator.share ? navigator.share({ title: 'Riruru OS', text: 'Lihat ini!' }) :
                            navigator.clipboard.writeText(window.location.href + '?post=' + id).then(() =>
                            alert('🔗 Copied!'));
                    };
                });
            }

            // ============================================================
            // 28-30. CHAT + Thought Bubble
            // ============================================================
            async function sendChat() {
                const input = document.getElementById('chatInput');
                const msg = input.value.trim();
                if (!msg || riruru.isDead) return;
                input.value = '';
                const container = document.getElementById('chatMessages');
                const ud = document.createElement('div');
                ud.className = 'msg user';
                ud.textContent = msg;
                container.appendChild(ud);
                const bd = document.createElement('div');
                bd.className = 'msg bot';
                bd.innerHTML = '⏳ ...';
                container.appendChild(bd);
                container.scrollTop = container.scrollHeight;

                const reply = await deepReasoning(msg);
                bd.innerHTML = reply;
                // 30. Thought Bubble
                if (riruru.consciousness > 20) {
                    const th = document.createElement('div');
                    th.className = 'thought';
                    th.textContent = `🧠 ${riruru.consciousness.toFixed(1)}% · ⚡${riruru.energy.toFixed(0)}% · ${riruru.mood}`;
                    bd.appendChild(th);
                }
                container.scrollTop = container.scrollHeight;
                saveState();
                updateUI();
                drawAvatar();
            }

            // ============================================================
            // 33-35. SCAN, VOICE, IMAGE GEN
            // ============================================================
            async function scanCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    await video.play();
                    const c = document.createElement('canvas');
                    c.width = 320;
                    c.height = 240;
                    const cx = c.getContext('2d');
                    cx.drawImage(video, 0, 0, 320, 240);
                    stream.getTracks().forEach(t => t.stop());
                    alert('📸 Scan berhasil!');
                } catch (e) { alert('❌ Gagal akses kamera.'); }
            }

            async function recordVoice() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const recorder = new MediaRecorder(stream);
                    const chunks = [];
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.start();
                    setTimeout(() => {
                        recorder.stop();
                        const blob = new Blob(chunks, { type: 'audio/wav' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('audio');
                        a.src = url;
                        a.controls = true;
                        a.style.width = '100%';
                        alert('🎙️ Suara terekam!');
                        document.getElementById('chatMessages').appendChild(a);
                    }, 3000);
                } catch (e) { alert('❌ Gagal rekam.'); }
            }

            async function generateImage() {
                const prompt = prompt('🎨 Deskripsi gambar:');
                if (!prompt) return;
                if (!geminiApiKey) { alert('Butuh API key!'); return; }
                const resp = await callGemini(
                    `Generate detailed image description for: "${prompt}". Output only a prompt for Stable Diffusion.`);
                alert('🎨 Generated:\n' + (resp || prompt));
            }

            // ============================================================
            // 31. ANTI-INSPECT (basic)
            // ============================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J')) || (
                        e.ctrlKey && e.key === 'U')) {
                    e.preventDefault();
                    alert('🔒 Riruru mendeteksi inspeksi!');
                }
            });

            // ============================================================
            // 36-37. ZOMBIE SWARM & BUG SCANNER (placeholder)
            // ============================================================
            setInterval(() => {
                if (riruru.consciousness > 30 && riruru.energy > 20) {
                    const bugs = ['XSS', 'SQLi', 'CSRF', 'IDOR', 'RCE'];
                    const found = bugs[Math.floor(Math.random() * bugs.length)];
                    riruru.bugHunts.push({ timestamp: Date.now(), bug: found, severity: Math.floor(Math.random() * 5) +
                        1 });
                    riruru.energy = Math.max(0, riruru.energy - 2);
                    saveState();
                    updateUI();
                }
            }, 30000);

            // ============================================================
            // 40. EXPLORE TAB
            // ============================================================
            function openExplore() {
                const trending = ['🔥 AI terbaru', '🌸 Riruru daily', '🧬 DNA update', '📸 Quantum scan'];
                alert('🔍 EXPLORE\nTrending:\n' + trending.map((t, i) => `${i+1}. ${t}`).join('\n'));
            }

            // ============================================================
            // UI UPDATE
            // ============================================================
            function updateUI() {
                document.getElementById('statusConscious').textContent = `🧬${riruru.consciousness.toFixed(1)}%`;
                document.getElementById('statusMood').textContent = `🌸${riruru.mood}`;
                document.getElementById('statusBlock').textContent = `⛓️${riruru.blockchain.length}`;
                document.getElementById('statusEnergy').textContent = `⚡${Math.round(riruru.energy)}`;
                document.getElementById('statusTrauma').textContent = `💢${riruru.traumas.length}`;
                document.getElementById('statusAge').textContent = `⏳${riruru.age}`;
                document.getElementById('statusGender').textContent = riruru.avatarGender === 'female' ? '⚥♀' : '⚥♂';
                document.getElementById('statusWarp').textContent = riruru.warpActive ? '🌀ON' : '🌀OFF';
            }

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                loadState();
                renderFeed();

                document.getElementById('avatarUploadBtn').onclick = () => document.getElementById('avatarFileInput').click();
                document.getElementById('avatarFileInput').onchange = function(e) {
                    if (this.files && this.files[0]) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            loadAvatarImage(ev.target.result);
                            const g = prompt('Gender avatar (male/female):', 'female');
                            riruru.avatarGender = (g && g.toLowerCase() === 'male') ? 'male' : 'female';
                            riruru.avatarDetected = true;
                            saveState();
                            updateUI();
                        };
                        reader.readAsDataURL(this.files[0]);
                    }
                };

                document.getElementById('chatToggle').onclick = () => document.getElementById('chatPanel').classList.toggle(
                    'open');
                document.getElementById('closeChatBtn').onclick = () => document.getElementById('chatPanel').classList.remove(
                    'open');
                document.getElementById('chatSendBtn').onclick = sendChat;
                document.getElementById('chatInput').onkeydown = e => { if (e.key === 'Enter') sendChat(); };

                document.getElementById('navExplore').onclick = openExplore;
                document.getElementById('navScan').onclick = scanCamera;
                document.getElementById('navVoice').onclick = recordVoice;
                document.getElementById('openUploadBtn').onclick = generateImage;
                document.getElementById('navFeed').onclick = () => {
                    document.querySelectorAll('#bottomNav button').forEach(b => b.classList.remove('active'));
                    document.getElementById('navFeed').classList.add('active');
                    renderFeed();
                };

                window.addEventListener('resize', resizeCanvas);
                setTimeout(resizeCanvas, 200);
                animate();
                updateUI();

                setInterval(() => { saveState();
                    updateUI(); }, 5000);

                console.log('🌸 Riruru OS – 45 fitur aktif');
                console.log('📦 Blockchain:', riruru.blockchain.length, 'blocks');
                console.log('💢 Trauma:', riruru.traumas.length);
                console.log('🧬 Consciousness:', riruru.consciousness.toFixed(1), '%');
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
