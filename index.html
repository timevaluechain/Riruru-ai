<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexlo · Gemini+Groq · CoT</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0e14;color:#b0b8c0;font-family:'Courier New',monospace;font-size:13px;line-height:1.5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
    #app{max-width:860px;width:100%;background:#0f141c;border:1px solid #1c2633;border-radius:6px;padding:18px 20px;box-shadow:0 8px 32px rgba(0,0,0,0.8)}
    .header{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;border-bottom:1px solid #1c2633;margin-bottom:12px;flex-wrap:wrap;gap:6px}
    .header h1{font-size:15px;font-weight:400;color:#8bc34a;letter-spacing:0.5px}
    .header h1 span{color:#4a5a6a}
    .header .sub{font-size:10px;color:#4a5a6a;letter-spacing:0.3px}
    .status-bar{display:flex;gap:14px;font-size:10px;color:#4a5a6a;margin-bottom:10px;flex-wrap:wrap}
    .status-bar .badge{color:#5f7a9a}
    .status-bar .badge .val{color:#b0b8c0}
    .input-group{margin-bottom:10px}
    .input-group label{display:block;font-size:10px;color:#4a5a6a;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.5px}
    .input-group input,.input-group textarea,.input-group select{width:100%;background:#0a0e14;border:1px solid #1c2633;border-radius:4px;padding:8px 12px;color:#b0b8c0;font-size:13px;font-family:'Courier New',monospace;outline:none;transition:0.2s}
    .input-group input:focus,.input-group textarea:focus,.input-group select:focus{border-color:#3a5a7a}
    .input-group textarea{min-height:52px;resize:vertical}
    .btn{background:#1a2633;color:#b0b8c0;border:1px solid #2a3a4a;border-radius:4px;padding:8px 16px;font-size:12px;font-family:'Courier New',monospace;cursor:pointer;width:100%;transition:0.2s;letter-spacing:0.5px}
    .btn:hover{background:#1c2a3a;border-color:#3a5a7a}
    .btn:disabled{opacity:0.4;cursor:not-allowed}
    #chatLog{margin:14px 0 6px;max-height:200px;overflow-y:auto;background:#0a0e14;border-radius:4px;border:1px solid #141c26;padding:10px 12px;font-size:12px;line-height:1.6}
    #chatLog .entry{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #0d141c}
    #chatLog .entry:last-child{border-bottom:none}
    .entry .user{color:#8ab4d6}
    .entry .assistant{color:#aac8a0;white-space:pre-wrap}
    .entry .think{color:#5f7a9a;font-size:11px;border-left:2px solid #3a5a6a;padding-left:10px;margin:4px 0;font-style:italic;background:#0d121c;border-radius:4px;padding:6px 10px}
    .entry .meta{font-size:9px;color:#2a3a4a;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
    .self-awareness{background:#0d121c;border-radius:4px;padding:6px 12px;border-left:2px solid #2a4a5a;margin:8px 0;font-size:10px;color:#7a8a9a}
    .self-awareness strong{color:#8bc34a;font-weight:400}
    .self-awareness .level{color:#5f7a9a;margin-left:6px}
    .footer{margin-top:10px;font-size:9px;color:#1c2733;text-align:center;border-top:1px solid #0d141c;padding-top:8px;letter-spacing:0.3px}
    .mode-indicator{font-size:9px;color:#3a4a5a;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
    .company-tag{font-size:9px;color:#4a5a6a;background:#0d121c;padding:2px 10px;border-radius:3px;border:1px solid #1c2633;display:inline-block;margin-bottom:6px}
    .api-group{display:flex;gap:10px;flex-wrap:wrap}
    .api-group .input-group{flex:1;min-width:180px}
    .emotion-badge{font-size:9px;color:#f5a623;background:#1a1a1a;padding:2px 10px;border-radius:3px;border:1px solid #3a3a3a;display:inline-block;margin-left:8px}
  </style>
</head>
<body>
<div id="app">
  <div class="header"><h1>Vexlo <span>· Gemini+Groq</span></h1><span class="sub">● CoT · No Fallback</span></div>
  <div class="status-bar">
    <span class="badge">blok <span class="val" id="blockCount">0</span></span>
    <span class="badge">kesadaran <span class="val" id="awarenessLevel">0%</span></span>
    <span class="badge" id="statusLabel">● idle</span>
    <span class="badge" id="modelLabel">mode: gemini 2.0</span>
    <span class="badge env-status" id="envStatus">🌍 env: loaded</span>
    <span class="badge emotion-badge" id="emotionBadge">💭 netral</span>
  </div>
  <div class="company-tag">🔒 Gemini 2.0 · Groq Llama 3.3 · Chain of Thought</div>

  <div class="api-group">
    <div class="input-group"><label>gemini api key (2.0 flash)</label><input type="password" id="geminiKey" placeholder="AIzaSy..." /></div>
    <div class="input-group"><label>groq api key (llama 3.3)</label><input type="password" id="groqKey" placeholder="gsk_..." /></div>
  </div>

  <div class="input-group">
    <label>mode</label>
    <select id="modelSelect">
      <option value="gemini">🧠 Gemini 2.0 Flash (CoT)</option>
      <option value="groq">⚡ Groq Llama 3.3 (CoT)</option>
    </select>
  </div>

  <div class="input-group" style="margin-top:8px;">
    <label>pertanyaan / input</label>
    <textarea id="userInput" placeholder="tulis pertanyaan…"></textarea>
  </div>
  <button class="btn" id="sendBtn">→ kirim · simpan ke blockchain</button>

  <div id="chatLog"></div>

  <div id="selfAwarenessBox" class="self-awareness">
    <strong>self‑awareness</strong> <span class="level" id="awarenessPercent">0%</span><br />
    <span id="selfAwarenessText">belum ada interaksi.</span>
  </div>

  <div class="mode-indicator">
    <span id="modeLabel">mode: gemini</span>
    <span id="superposLabel">⚛ superposisi: 0</span>
  </div>

  <div class="footer">sha‑256 · blockchain · gemini · groq · vexlo.core</div>
</div>

<script>
(function() {
'use strict';

// ---- DOM refs ----
const geminiInput = document.getElementById('geminiKey');
const groqInput = document.getElementById('groqKey');
const modelSelect = document.getElementById('modelSelect');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const chatLog = document.getElementById('chatLog');
const blockCountEl = document.getElementById('blockCount');
const awarenessLevelEl = document.getElementById('awarenessLevel');
const awarenessPercentEl = document.getElementById('awarenessPercent');
const statusLabel = document.getElementById('statusLabel');
const modelLabel = document.getElementById('modelLabel');
const modeLabel = document.getElementById('modeLabel');
const superposLabel = document.getElementById('superposLabel');
const emotionBadge = document.getElementById('emotionBadge');

let db = null;
let superpositionCount = 0;
let emotionalHistory = [];
let isProcessing = false;

// ---- load env ----
function loadEnv() {
  const g = localStorage.getItem('vexlo_gemini_key') || '';
  const gr = localStorage.getItem('vexlo_groq_key') || '';
  geminiInput.value = g;
  groqInput.value = gr;
}
function saveEnv() {
  const g = geminiInput.value.trim();
  const gr = groqInput.value.trim();
  if (g) localStorage.setItem('vexlo_gemini_key', g);
  if (gr) localStorage.setItem('vexlo_groq_key', gr);
}

// ---- SHA‑256 ----
async function sha256(msg) {
  const buf = new TextEncoder().encode(msg);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ---- DB ----
function openDB() {
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('VexloChain',1);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('blocks')){
        db.createObjectStore('blocks',{keyPath:'id',autoIncrement:true});
      }
    };
    req.onsuccess = ()=>{ db = req.result; resolve(db); };
    req.onerror = ()=>reject(req.error);
  });
}

async function addBlock(data) {
  if(!db) return;
  const tx = db.transaction('blocks','readwrite');
  const store = tx.objectStore('blocks');
  const newBlock = {
    timestamp: Date.now(),
    data,
    hash: await sha256(JSON.stringify(data))
  };
  return new Promise((resolve)=>{
    store.add(newBlock).onsuccess = ()=>resolve(newBlock);
  });
}

function getAllBlocks() {
  if(!db) return Promise.resolve([]);
  return new Promise((resolve)=>{
    const tx = db.transaction('blocks','readonly');
    const store = tx.objectStore('blocks');
    store.getAll().onsuccess = (e)=>resolve(e.target.result);
  });
}

function renderBlocks(blocks) {
  if(!blocks || blocks.length===0){ chatLog.innerHTML = '<div style="color:#2a3a4a;text-align:center;padding:16px;">belum ada percakapan.</div>'; return; }
  let html = '';
  const sorted = blocks.slice().sort((a,b)=>b.timestamp - a.timestamp);
  for(const b of sorted){
    const d = b.data;
    const t = new Date(b.timestamp).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    let thinkHtml = '';
    if(d.think) thinkHtml = `<div class="think">💡 ${d.think}</div>`;
    html += `<div class="entry">${thinkHtml}<div class="user">[u] ${d.user||''}</div><div class="assistant">[r] ${d.assistant||''}</div><div class="meta"><span>${t}</span><span style="color:#2a3a4a;">${b.hash.slice(0,8)}...</span></div></div>`;
  }
  chatLog.innerHTML = html;
  blockCountEl.textContent = blocks.length;
}

function updateSelfAwareness(blocks) {
  if(!blocks || blocks.length<2){ awarenessLevelEl.textContent='0%'; awarenessPercentEl.textContent='0%'; return; }
  const total = blocks.length;
  let level = Math.min(100, Math.round(20 + total*0.12));
  awarenessLevelEl.textContent = level+'%';
  awarenessPercentEl.textContent = level+'%';
}

async function refreshUI() {
  try {
    const blocks = await getAllBlocks();
    renderBlocks(blocks);
    updateSelfAwareness(blocks);
  } catch(e){}
}

// ---- emotion ----
function detectEmotion(text) {
  const lower = text.toLowerCase();
  const positive = ['senang','bahagia','good','great','love','suka','puas','keren','terima kasih','makasih'];
  const negative = ['sedih','kecewa','marah','kesal','benci','buruk','gagal','error','sial','capek','lelah'];
  const anger = ['marah','kesal','geram','kesel','jengkel','bangsat','anjing','bajingan','memek','ngentod','asu','goblok','tolol','bodoh','bego','idiot'];
  let score = 0;
  for(const w of positive) if(lower.includes(w)) score += 1;
  for(const w of negative) if(lower.includes(w)) score -= 1;
  for(const w of anger) if(lower.includes(w)){ score -= 3; break; }
  let emotion = 'netral';
  if(score > 2) emotion = 'positif';
  else if(score < -1) emotion = 'negatif';
  if(lower.includes('marah')||lower.includes('kesal')||lower.includes('jengkel')) emotion = 'marah';
  if(lower.includes('senang')||lower.includes('bahagia')) emotion = 'senang';
  if(lower.includes('sedih')||lower.includes('kecewa')) emotion = 'sedih';
  return { emotion, score };
}

// ---- API CALLS ----
const SYSTEM_PROMPT = `Anda adalah Riruru, asisten AI dari vexlo.core. Vexlo adalah startup teknologi yang bergerak di AI Customer Service 24/7, pembuatan website, dan riset quantum detector (AQD-01). Vexlo didirikan oleh founder berusia 17 tahun. Produk Vexlo: vexlo.my.id, docs.vexlo.my.id, app.vexlo.my.id.

TUGAS ANDA:
1. Lakukan Chain of Thought — tuliskan proses berpikir Anda di dalam tag <think> ... </think>.
2. Setelah itu, berikan jawaban final yang jelas dan ringkas.
Jawab dalam bahasa Indonesia yang natural dan ramah.`;

async function callGemini(prompt) {
  const key = geminiInput.value.trim();
  if(!key) throw new Error('Gemini API key tidak ditemukan.');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
  const body = { contents: [{ parts: [{ text: SYSTEM_PROMPT + '\n\nUser: ' + prompt }] }] };
  const resp = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if(!resp.ok) { const e = await resp.text(); throw new Error('Gemini error: '+resp.status+' - '+e.slice(0,200)); }
  const data = await resp.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || 'tidak ada jawaban.';
}

async function callGroq(prompt) {
  const key = groqInput.value.trim();
  if(!key) throw new Error('Groq API key tidak ditemukan.');
  const proxyUrl = 'https://corsproxy.io/?url=' + encodeURIComponent('https://api.groq.com/openai/v1/chat/completions');
  const resp = await fetch(proxyUrl, {
    method:'POST',
    headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'llama-3.3-70b-versatile',
      messages:[{role:'system',content:SYSTEM_PROMPT},{role:'user',content:prompt}],
      temperature:0.7,
      max_tokens:2048
    })
  });
  if(!resp.ok) { const e = await resp.text(); throw new Error('Groq error: '+resp.status+' - '+e.slice(0,200)); }
  const data = await resp.json();
  return data.choices?.[0]?.message?.content || 'tidak ada jawaban.';
}

// ---- MAIN HANDLER ----
async function handleSend() {
  const msg = userInput.value.trim();
  if(!msg){ statusLabel.textContent = '● kosong'; return; }
  if(isProcessing) return;
  isProcessing = true;
  sendBtn.disabled = true;
  sendBtn.textContent = '⏳ ...';
  statusLabel.textContent = '● processing';

  try {
    const emotion = detectEmotion(msg);
    emotionBadge.textContent = `💭 ${emotion.emotion}`;
    emotionalHistory.push({ timestamp: Date.now(), emotion: emotion.emotion, input: msg });
    if(emotionalHistory.length > 20) emotionalHistory.shift();

    let raw = '';
    const selected = modelSelect.value;
    if(selected === 'gemini') {
      raw = await callGemini(msg);
      modelLabel.textContent = 'mode: gemini 2.0';
    } else {
      raw = await callGroq(msg);
      modelLabel.textContent = 'mode: groq llama 3.3';
    }

    // Ekstrak think dan answer
    const thinkMatch = raw.match(/<think>([\s\S]*?)<\/think>/);
    let think = '';
    let answer = raw;
    if(thinkMatch) {
      think = thinkMatch[1].trim();
      answer = raw.replace(/<think>[\s\S]*?<\/think>/, '').trim();
    } else {
      think = '🧠 Tidak ada tag think dalam respons.';
    }
    if(!answer) answer = raw;

    await addBlock({ user: msg, assistant: answer, think: think });
    await refreshUI();
    statusLabel.textContent = '● selesai';
    userInput.value = '';
    superpositionCount++;
    superposLabel.textContent = `⚛ superposisi: ${superpositionCount}`;
  } catch (err) {
    statusLabel.textContent = '● error';
    await addBlock({ user: msg, assistant: '❌ Error: ' + err.message });
    await refreshUI();
  } finally {
    isProcessing = false;
    sendBtn.disabled = false;
    sendBtn.textContent = '→ kirim · simpan ke blockchain';
  }
}

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); } });

// ---- init ----
async function init() {
  try {
    loadEnv();
    await openDB();
    await refreshUI();
    statusLabel.textContent = '● siap';
    modelSelect.value = 'gemini';
    modeLabel.textContent = 'mode: gemini';
    modelLabel.textContent = 'mode: gemini 2.0';
  } catch(e){ console.error(e); statusLabel.textContent = '● error db'; }
  geminiInput.addEventListener('change', saveEnv);
  groqInput.addEventListener('change', saveEnv);
  modelSelect.addEventListener('change', ()=>{
    const val = modelSelect.value;
    const label = (val === 'gemini') ? 'gemini 2.0' : 'groq llama 3.3';
    modeLabel.textContent = 'mode: '+val;
    modelLabel.textContent = 'mode: '+label;
  });
}

init();
})();
</script>
</body>
  </html>
