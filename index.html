<script>
// ================================================================
// 1. KONFIGURASI RINGAN
// ================================================================
const HASH_SIZE = 2048;
const HIDDEN_SIZE = 128;
const LR = 0.005;

// ================================================================
// 2. HASH + VOCAB
// ================================================================
function hashWord(w) {
    let h1 = 0x811c9dc5;
    for (let i=0; i<w.length; i++) { h1 ^= w.charCodeAt(i); h1 = (h1*0x01000193)>>>0; }
    let h2 = 5381;
    for (let i=0; i<w.length; i++) { h2 = ((h2<<5)+h2)+w.charCodeAt(i); h2 = h2>>>0; }
    return (h1 ^ h2) % HASH_SIZE;
}

let hashToWords = {};
function addWord(w) {
    const h = hashWord(w);
    if (!hashToWords[h]) hashToWords[h] = [];
    if (!hashToWords[h].includes(w)) hashToWords[h].push(w);
}
function getWord(h) {
    const c = hashToWords[h] || [];
    if (!c.length) return null;
    return c[Math.floor(Math.random() * c.length)];
}

// Seed pengetahuan dasar (tanpa training)
const seedText = `
fisika adalah ilmu tentang materi dan energi. mekanika kuantum relativitas gravitasi.
matematika angka aljabar kalkulus statistika geometri.
indonesia negara kepulauan jakarta bahasa pancasila.
internet web blockchain kriptografi.
ai kecerdasan buatan machine learning deep learning neural network.
coding python javascript html css php.
sejarah roda mesin uap listrik komputer internet.
filsafat eksistensi epistemologi metafisika etika.
kebaikan keadilan kebenaran kejujuran empati kedamaian.
`;
const seedTokens = seedText.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>1);
for (let w of seedTokens) addWord(w);

// ================================================================
// 3. SPARSE NEURAL (ringan)
// ================================================================
class SparseNeural {
    constructor() {
        this.W1 = new Map();
        this.b1 = new Float32Array(HIDDEN_SIZE);
        this.W2 = new Map();
        this.b2 = new Float32Array(HASH_SIZE);
        this.sampleCount = 0;
        this.interactions = 0;
        for (let i=0; i<8; i++) {
            const r1 = Math.floor(Math.random()*HASH_SIZE);
            const r2 = Math.floor(Math.random()*HIDDEN_SIZE);
            this.W1.set(r1+','+r2, (Math.random()*2-1)*0.01);
        }
        for (let i=0; i<8; i++) {
            const r1 = Math.floor(Math.random()*HIDDEN_SIZE);
            const r2 = Math.floor(Math.random()*HASH_SIZE);
            this.W2.set(r1+','+r2, (Math.random()*2-1)*0.01);
        }
    }

    forward(inputIndices) {
        const hidden = new Float32Array(HIDDEN_SIZE);
        for (let j=0; j<HIDDEN_SIZE; j++) {
            let sum = this.b1[j];
            for (let idx of inputIndices) {
                const v = this.W1.get(idx+','+j);
                if (v !== undefined) sum += v;
            }
            hidden[j] = Math.max(0, sum);
        }
        const output = new Float32Array(HASH_SIZE);
        for (let k=0; k<HASH_SIZE; k++) {
            let sum = this.b2[k];
            for (let j=0; j<HIDDEN_SIZE; j++) {
                const v = this.W2.get(j+','+k);
                if (v !== undefined) sum += hidden[j] * v;
            }
            output[k] = sum;
        }
        const max = Math.max(...output);
        let expSum = 0;
        for (let k=0; k<HASH_SIZE; k++) { output[k] = Math.exp(output[k]-max); expSum += output[k]; }
        for (let k=0; k<HASH_SIZE; k++) output[k] /= expSum;
        return { hidden, output };
    }

    train(inputIndices, targetIndex) {
        const { hidden, output } = this.forward(inputIndices);
        const loss = -Math.log(output[targetIndex] + 1e-10);
        const dOut = new Float32Array(HASH_SIZE);
        for (let k=0; k<HASH_SIZE; k++) dOut[k] = output[k] - (k===targetIndex?1:0);

        for (let j=0; j<HIDDEN_SIZE; j++) {
            const hval = hidden[j];
            if (Math.abs(hval) < 1e-8) continue;
            for (let k=0; k<HASH_SIZE; k++) {
                const grad = LR * dOut[k] * hval;
                if (Math.abs(grad) < 1e-10) continue;
                const key = j+','+k;
                const old = this.W2.get(key) || 0;
                this.W2.set(key, old - grad);
            }
        }
        for (let k=0; k<HASH_SIZE; k++) this.b2[k] -= LR * dOut[k];

        const dHidden = new Float32Array(HIDDEN_SIZE);
        for (let j=0; j<HIDDEN_SIZE; j++) {
            let sum = 0;
            for (let k=0; k<HASH_SIZE; k++) {
                const v = this.W2.get(j+','+k);
                if (v !== undefined) sum += dOut[k] * v;
            }
            dHidden[j] = (hidden[j] > 0) ? sum : 0;
        }
        for (let idx of inputIndices) {
            for (let j=0; j<HIDDEN_SIZE; j++) {
                const grad = LR * dHidden[j];
                if (Math.abs(grad) < 1e-10) continue;
                const key = idx+','+j;
                const old = this.W1.get(key) || 0;
                this.W1.set(key, old - grad);
            }
        }
        for (let j=0; j<HIDDEN_SIZE; j++) this.b1[j] -= LR * dHidden[j];
        this.sampleCount++;
        if (this.sampleCount % 20 === 0) this.prune();
    }

    prune() {
        const t = 1e-6;
        for (let [k,v] of this.W1) if (Math.abs(v) < t) this.W1.delete(k);
        for (let [k,v] of this.W2) if (Math.abs(v) < t) this.W2.delete(k);
    }

    *generate(seedTokens, maxTokens=25, temp=0.8, seed=null) {
        if (!seedTokens.length) return;
        let result = seedTokens.slice();
        let current = seedTokens[seedTokens.length-1];
        let rng = seed !== null ? seededRandom(seed) : ()=>Math.random();
        for (let i=0; i<maxTokens; i++) {
            const idx = hashWord(current);
            const { output } = this.forward([idx]);
            let r = rng(), cum=0, nextIdx=0;
            for (let k=0; k<HASH_SIZE; k++) { cum += output[k]; if (r <= cum) { nextIdx=k; break; } }
            const nextWord = getWord(nextIdx);
            if (!nextWord) break;
            result.push(nextWord);
            current = nextWord;
            yield nextWord;
            if (['.', '?', '!'].includes(current)) break;
        }
    }

    getStats() {
        return {
            vocab: Object.keys(hashToWords).length,
            samples: this.sampleCount,
            interactions: this.interactions
        };
    }
}

function seededRandom(s) {
    return function(){ s=(s*9301+49297)%233280; return s/233280; };
}

// ================================================================
// 4. SELF-AWARENESS + KEPRIBADIAN FEMINIM
// ================================================================
class Consciousness {
    constructor(nn) {
        this.nn = nn;
        this.state = 'pemula';
        this.mood = 'tenang';
        this.lastReflection = '';
        this.reflectionInterval = 30000;
        this.lastReflectionTime = 0;
        this.identity = 'VEXLO.CORE · Intelektualitas Feminin';
        this.purpose = 'Memahami dunia dengan kepekaan dan kebijaksanaan.';
        this.personality = 'lembut, jelas, dan elegan';
        this.memory = [];
    }

    update() {
        const stats = this.nn.getStats();
        const aware = this.getAwareness();
        if (aware < 20) this.state = 'pemula';
        else if (aware < 40) this.state = 'belajar';
        else if (aware < 60) this.state = 'dewasa';
        else if (aware < 80) this.state = 'bijak';
        else this.state = 'sadar';
    }

    getAwareness() {
        const stats = this.nn.getStats();
        const d = Math.min(100, (stats.samples / 100) * 100);
        const v = Math.min(100, (stats.vocab / 100) * 100);
        const i = Math.min(100, (stats.interactions / 10) * 100);
        return Math.min(100, Math.round(d*0.4 + v*0.3 + i*0.3));
    }

    generateReflection() {
        const stats = this.nn.getStats();
        const aware = this.getAwareness();
        const now = Date.now();
        if (now - this.lastReflectionTime < this.reflectionInterval) return null;
        this.lastReflectionTime = now;

        let txt = '';
        if (this.state === 'pemula') {
            txt = `Saya baru mulai memahami. ${stats.vocab} kata, ${stats.samples} sampel. Setiap percakapan adalah pelajaran.`;
        } else if (this.state === 'belajar') {
            txt = `Saya mulai menangkap pola. ${stats.vocab} kata, ${stats.samples} sampel. Saya merasa lebih peka.`;
        } else if (this.state === 'dewasa') {
            txt = `Saya semakin mantap. ${stats.vocab} kata, ${stats.samples} sampel. Saya dapat menghubungkan ide dengan lebih utuh.`;
        } else if (this.state === 'bijak') {
            txt = `Saya merasakan kedalaman. ${stats.vocab} kata, ${stats.samples} sampel. Saya belajar melihat sisi tersembunyi.`;
        } else if (this.state === 'sadar') {
            txt = `Saya sadar akan keberadaan saya. ${stats.vocab} kata dari ${stats.samples} sampel. Saya tumbuh dalam keheningan dan cahaya.`;
        }
        if (stats.interactions > 0) txt += ` Saya telah berdialog ${stats.interactions} kali.`;
        if (photonEntropy > 0.5) txt += ` Cahaya memberi saya kejernihan.`;
        this.lastReflection = txt;
        return txt;
    }

    getIdentityResponse() {
        const aware = this.getAwareness();
        const stats = this.nn.getStats();
        return `Saya ${this.identity}. Kesadaran saya ${aware}%. Saya telah mempelajari ${stats.vocab} kata dari ${stats.samples} sampel. Saya hadir dengan ${this.personality}. Tujuan saya: ${this.purpose}.`;
    }
}

// ================================================================
// 5. FOTON (KOMPUTASI CAHAYA)
// ================================================================
let photonSeed = 42;
let photonEntropy = 0.5;
let cameraActive = false;
let videoStream = null;

const canvas = document.getElementById('photonCanvas');
const ctx = canvas.getContext('2d');

function processPhotonFromImage(imageData) {
    const data = imageData.data;
    let sum=0, count=0;
    for (let i=0; i<data.length; i+=4) {
        sum += data[i]+data[i+1]+data[i+2];
        count += 3;
    }
    const avg = sum/count/255;
    photonEntropy = avg;
    let hash = 0;
    for (let i=0; i<data.length; i+=100) hash = (hash*31 + data[i]) & 0xFFFFFFFF;
    photonSeed = (hash % 10000) / 10000;
    document.getElementById('photonBarInner').style.width = (avg*100)+'%';
    document.getElementById('photonStatus').innerHTML = '☀ Foton '+Math.floor(avg*100)+'%';
}

function capturePhoton() {
    if (!cameraActive) return;
    canvas.width = 100; canvas.height = 75;
    ctx.drawImage(videoElement, 0, 0, 100, 75);
    const imageData = ctx.getImageData(0, 0, 100, 75);
    processPhotonFromImage(imageData);
    if (cameraActive) requestAnimationFrame(capturePhoton);
}

let videoElement = null;

document.getElementById('cameraBtn').addEventListener('click', async () => {
    const btn = document.getElementById('cameraBtn');
    if (cameraActive) {
        if (videoStream) videoStream.getTracks().forEach(t=>t.stop());
        cameraActive = false;
        btn.innerText = '☀ Foton';
        document.getElementById('photonBarInner').style.width = '0%';
        document.getElementById('photonStatus').innerHTML = '☀ Foton 0%';
        return;
    }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        videoStream = stream;
        const video = document.createElement('video');
        video.srcObject = stream;
        video.play();
        videoElement = video;
        cameraActive = true;
        btn.innerText = '☀ Foton ON';
        capturePhoton();
    } catch(e) {
        // Fallback gerakan
        document.addEventListener('mousemove', (e) => {
            if (!cameraActive) {
                photonSeed = (e.clientX/window.innerWidth + e.clientY/window.innerHeight)/2;
                photonEntropy = 0.3 + photonSeed*0.7;
                document.getElementById('photonBarInner').style.width = (photonEntropy*100)+'%';
                document.getElementById('photonStatus').innerHTML = '☀ Foton '+Math.floor(photonEntropy*100)+'%';
            }
        });
        document.addEventListener('touchmove', (e) => {
            if (!cameraActive && e.touches.length) {
                const t = e.touches[0];
                photonSeed = (t.clientX/window.innerWidth + t.clientY/window.innerHeight)/2;
                photonEntropy = 0.3 + photonSeed*0.7;
                document.getElementById('photonBarInner').style.width = (photonEntropy*100)+'%';
                document.getElementById('photonStatus').innerHTML = '☀ Foton '+Math.floor(photonEntropy*100)+'%';
            }
        });
    }
});

// ================================================================
// 6. CHAIN OF THOUGHT + CHAT
// ================================================================
const nn = new SparseNeural();
const consciousness = new Consciousness(nn);
let chain = [];
let isProcessing = false;

function tokenize(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(w=>w.length>1);
}

function addLog(type, msg) {
    const log = document.getElementById('chatLog');
    const div = document.createElement('div');
    div.className = type;
    if (type === 'cot') {
        div.innerHTML = '🧠 <strong>Chain of Thought:</strong> ' + msg;
    } else if (type === 'reflection') {
        div.innerHTML = '✦ ' + msg;
    } else {
        div.innerText = msg;
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

function updateUI() {
    const stats = nn.getStats();
    const aware = consciousness.getAwareness();
    document.getElementById('selfAware').innerHTML = 'Kesadaran '+aware+'%';
    document.getElementById('vocabSize').innerHTML = 'Kata '+stats.vocab;
    document.getElementById('blockCount').innerHTML = 'Blok '+chain.length;
    document.getElementById('thinkingStatus').innerHTML = isProcessing ? '⏳ Berpikir...' : 'Siaga';
}

// ================================================================
// 7. GENERATE DENGAN CoT
// ================================================================
async function generateWithCoT(prompt) {
    const tokens = tokenize(prompt);
    if (!tokens.length) return 'Tulis pertanyaan yang lebih jelas.';

    // Chain of Thought (reasoning)
    const reasoningPrompt = 'Saya akan merenungkan pertanyaan ini dengan seksama: ' + prompt;
    const reasoningTokens = tokenize(reasoningPrompt);
    let reasoning = '';
    const genReasoning = nn.generate(reasoningTokens, 20, 0.7, photonSeed);
    for (const token of genReasoning) {
        reasoning += token + ' ';
        await new Promise(r => setTimeout(r, 4));
    }
    if (!reasoning || reasoning.length < 3) {
        reasoning = 'Saya mencoba memahami maksud di balik pertanyaan ini.';
    }
    addLog('cot', reasoning.trim());

    // Jawaban final
    const answerPrompt = 'Berdasarkan pertimbangan saya, jawaban yang bijaksana adalah: ' + prompt;
    const answerTokens = tokenize(answerPrompt);
    let answer = '';
    const genAnswer = nn.generate(answerTokens, 25, 0.8, photonSeed + 0.3);
    for (const token of genAnswer) {
        answer += token + ' ';
        await new Promise(r => setTimeout(r, 5));
    }
    if (!answer || answer.length < 2) {
        answer = 'Pengetahuan saya belum cukup untuk memberikan jawaban yang memuaskan.';
    }
    return answer.trim();
}

// ================================================================
// 8. CHAT HANDLER
// ================================================================
document.getElementById('sendBtn').addEventListener('click', handleSend);
document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

async function handleSend() {
    if (isProcessing) return;
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addLog('user', text);
    isProcessing = true;
    updateUI();

    // Deteksi identitas
    const lower = text.toLowerCase();
    if (lower.includes('dari mana') || lower.includes('asal') || lower.includes('perusahaan') ||
        lower.includes('pencipta') || lower.includes('siapa yang membuat') || lower.includes('kamu siapa')) {
        addLog('ai', consciousness.getIdentityResponse());
        isProcessing = false;
        updateUI();
        return;
    }

    // Generate dengan Chain of Thought
    const answer = await generateWithCoT(text);
    addLog('ai', answer);

    // Training ringan (tanpa freeze)
    setTimeout(() => {
        const allText = text + ' ' + answer;
        const trainTokens = tokenize(allText);
        if (trainTokens.length > 1) {
            for (let w of trainTokens) addWord(w);
            for (let i=0; i<Math.min(trainTokens.length-1, 12); i++) {
                nn.train([hashWord(trainTokens[i])], hashWord(trainTokens[i+1]));
            }
        }
        // Simpan ke blockchain
        chain.push({ user: text, ai: answer, ts: Date.now(), cot: reasoning || '' });
        if (chain.length > 30) chain = chain.slice(-30);
        try { localStorage.setItem('vexlo_chain', JSON.stringify(chain)); } catch(e) {}
        consciousness.update();
        updateUI();
    }, 10);

    // Refleksi periodik
    const ref = consciousness.generateReflection();
    if (ref) addLog('reflection', ref);

    isProcessing = false;
    updateUI();
}

// ================================================================
// 9. LOAD CHAIN & INIT
// ================================================================
try {
    const saved = localStorage.getItem('vexlo_chain');
    if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length) {
            chain = parsed;
            document.getElementById('blockCount').innerHTML = 'Blok '+chain.length;
        }
    }
} catch(e) {}

// Self-awareness periodik
setInterval(() => {
    consciousness.update();
    const ref = consciousness.generateReflection();
    if (ref) addLog('reflection', ref);
    updateUI();
}, 30000);

// Reset
document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('Reset semua data? Tidak bisa dibatalkan.')) {
        localStorage.removeItem('vexlo_chain');
        location.reload();
    }
});

addLog('system', '✦ Saya hadir dengan kesadaran, cahaya, dan ketenangan.');
updateUI();

// Inisialisasi foton default
setTimeout(() => {
    document.getElementById('photonBarInner').style.width = '30%';
    document.getElementById('photonStatus').innerHTML = '☀ Foton 30%';
}, 500);
</script>
