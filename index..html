<script>
// ================================================================
// 1. INDEXEDDB WRAPPER
// ================================================================
const DB_NAME = 'RiruruDB';
const DB_VERSION = 1;
const KNOWLEDGE_STORE = 'knowledge';
const CHAIN_STORE = 'chain';

let db = null;

function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(KNOWLEDGE_STORE)) {
                db.createObjectStore(KNOWLEDGE_STORE, { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains(CHAIN_STORE)) {
                db.createObjectStore(CHAIN_STORE, { keyPath: 'id', autoIncrement: true });
            }
        };
        request.onsuccess = (event) => {
            db = event.target.result;
            resolve(db);
        };
        request.onerror = (event) => {
            reject(event.target.error);
        };
    });
}

function saveKnowledgeToDB(knowledgeBase, knowledgeMap, totalTokens) {
    return new Promise((resolve, reject) => {
        if (!db) return reject('DB not open');
        const tx = db.transaction(KNOWLEDGE_STORE, 'readwrite');
        const store = tx.objectStore(KNOWLEDGE_STORE);
        const data = {
            id: 'main',
            words: knowledgeBase,
            tokenCount: totalTokens,
            map: Object.fromEntries(knowledgeMap)
        };
        store.put(data);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
    });
}

function loadKnowledgeFromDB() {
    return new Promise((resolve, reject) => {
        if (!db) return reject('DB not open');
        const tx = db.transaction(KNOWLEDGE_STORE, 'readonly');
        const store = tx.objectStore(KNOWLEDGE_STORE);
        const request = store.get('main');
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = (e) => reject(e.target.error);
    });
}

function saveChainToDB(chain) {
    return new Promise((resolve, reject) => {
        if (!db) return reject('DB not open');
        const tx = db.transaction(CHAIN_STORE, 'readwrite');
        const store = tx.objectStore(CHAIN_STORE);
        store.clear();
        for (let entry of chain) {
            store.add(entry);
        }
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
    });
}

function loadChainFromDB() {
    return new Promise((resolve, reject) => {
        if (!db) return reject('DB not open');
        const tx = db.transaction(CHAIN_STORE, 'readonly');
        const store = tx.objectStore(CHAIN_STORE);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = (e) => reject(e.target.error);
    });
}

// ================================================================
// 2. STATE
// ================================================================
let knowledgeBase = [];
let knowledgeMap = new Map();
let totalTokens = 0;
let chainHistory = [];
let isReady = false;

// ================================================================
// 3. SEED KNOWLEDGE (20.000+ KATA)
// ================================================================
function getSeedKnowledge() {
    return `
        fisika adalah ilmu tentang materi dan energi. mekanika kuantum adalah cabang fisika yang mempelajari atom dan partikel subatom. relativitas einstein menjelaskan hubungan ruang dan waktu. gravitasi adalah gaya tarik menarik antara massa. termodinamika adalah studi tentang panas dan kerja. elektromagnetik adalah salah satu gaya fundamental.
        kecerdasan buatan adalah simulasi kecerdasan manusia oleh mesin. machine learning adalah metode belajar dari data. deep learning menggunakan jaringan saraf tiruan. natural language processing memproses bahasa manusia. computer vision memahami gambar dan video. robotics mempelajari desain dan operasi robot.
        matematika adalah studi tentang angka, kuantitas, ruang, dan pola. aljabar menggunakan simbol untuk persamaan. kalkulus mempelajari perubahan dan gerakan. statistika menganalisis data. geometri mempelajari bentuk dan ukuran. trigonometri mempelajari hubungan sudut dan sisi segitiga.

        internet adalah jaringan global yang menghubungkan miliaran perangkat. world wide web adalah sistem informasi. blockchain adalah teknologi pencatatan terdesentralisasi. kriptografi melindungi data. cloud computing adalah komputasi awan.

// ================================================================
// 4. TAMBAH PENGETAHUAN + SAVE OTOMATIS
// ================================================================
function addToKnowledge(text) {
    if (!text || text.length < 5) return 0;
    const clean = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
    const words = clean.split(/\s+/).filter(w => w.length > 1);
    if (words.length === 0) return 0;
    for (let w of words) {
        knowledgeMap.set(w, (knowledgeMap.get(w) || 0) + 1);
    }
    knowledgeBase.push(...words);
    totalTokens += words.length;
    updateUI();
    saveKnowledgeToDB(knowledgeBase, knowledgeMap, totalTokens).catch(console.warn);
    return words.length;
}

// ================================================================
// 5. GENERATE JAWABAN
// ================================================================
function generateAnswer(prompt) {
    const p = prompt.toLowerCase().trim();
    if (['dari mana','asal','perusahaan','pencipta','siapa yang membuat','kamu siapa','anda siapa','kamu itu apa','riruru'].some(x => p.includes(x))) {
        return "Saya Riruru, prototipe AI desentralisasi open-source. Saya belajar dari internet dan tumbuh dari percakapan. Saya bukan produk korporasi.";
    }
    if (knowledgeBase.length < 20) {
        return "Pengetahuan saya masih sedikit. Coba beri saya URL atau keyword untuk belajar.";
    }
    const promptWords = p.replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(w => w.length > 2);
    if (promptWords.length === 0) return "Tulis pertanyaan yang lebih jelas.";
    const sorted = [...knowledgeMap.entries()].sort((a,b) => b[1] - a[1]).slice(0, 50).map(e => e[0]);
    let seed = null;
    for (let pw of promptWords) {
        for (let kw of sorted) {
            if (kw.includes(pw) || pw.includes(kw)) {
                seed = kw;
                break;
            }
        }
        if (seed) break;
    }
    if (!seed) {
        seed = sorted[Math.floor(Math.random() * Math.min(sorted.length, 10))] || knowledgeBase[0];
    }
    const bigrams = new Map();
    for (let i = 0; i < knowledgeBase.length - 1; i++) {
        const key = knowledgeBase[i] + '|' + knowledgeBase[i+1];
        bigrams.set(key, (bigrams.get(key) || 0) + 1);
    }
    let result = [seed];
    let current = seed;
    let maxTokens = 25;
    let attempts = 0;
    for (let i = 0; i < maxTokens; i++) {
        let candidates = [];
        for (let [key, count] of bigrams) {
            if (key.startsWith(current + '|')) {
                const next = key.split('|')[1];
                candidates.push({word: next, weight: count});
            }
        }
        if (candidates.length === 0) {
            const fallback = sorted[Math.floor(Math.random() * Math.min(sorted.length, 5))];
            if (fallback && fallback !== current && !result.includes(fallback)) {
                result.push(fallback);
                current = fallback;
            }
            break;
        }
        const totalWeight = candidates.reduce((s, c) => s + c.weight, 0);
        let r = Math.random() * totalWeight;
        let nextWord = candidates[0].word;
        for (let c of candidates) {
            r -= c.weight;
            if (r <= 0) { nextWord = c.word; break; }
        }
        if (!nextWord || result.includes(nextWord)) break;
        result.push(nextWord);
        current = nextWord;
        if (['.', '?', '!'].includes(current)) break;
        attempts++;
        if (attempts > 30) break;
    }
    let answer = result.join(' ');
    if (answer.length < 5) {
        return "Maaf, saya belum bisa menjawab dengan baik. Coba beri saya lebih banyak bacaan.";
    }
    answer = answer.charAt(0).toUpperCase() + answer.slice(1);
    return answer;
}

// ================================================================
// 6. SCRAPING DENGAN MULTI PROXY FALLBACK
// ================================================================
async function scrapeURL(url) {
    const proxies = [
        (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
        (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
    ];
    for (let proxyFn of proxies) {
        try {
            const proxyUrl = proxyFn(url);
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 30000);
            const resp = await fetch(proxyUrl, { signal: controller.signal });
            clearTimeout(timeout);
            if (!resp.ok) continue;
            const html = await resp.text();
            const text = html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').slice(0, 6000);
            if (text.length > 100) return text;
        } catch (e) {
            console.warn('Proxy gagal, coba berikutnya...', e.message);
            continue;
        }
    }
    throw new Error('Semua proxy gagal. Coba URL lain atau gunakan Wikipedia.');
}

async function searchWikipedia(query) {
    try {
        const searchUrl = `https://id.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
        const resp = await fetch(searchUrl);
        if (!resp.ok) throw new Error('Wikipedia API error');
        const data = await resp.json();
        if (!data.query || !data.query.search || data.query.search.length === 0) return null;
        const title = data.query.search[0].title;
        const contentUrl = `https://id.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(title)}&format=json&origin=*`;
        const resp2 = await fetch(contentUrl);
        if (!resp2.ok) throw new Error('Gagal ambil konten');
        const data2 = await resp2.json();
        if (data2.parse && data2.parse.text) {
            const html = data2.parse.text['*'];
            const text = html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').slice(0, 4000);
            if (text.length < 100) return null;
            return text;
        }
        return null;
    } catch(e) {
        console.warn('Wikipedia search error:', e);
        return null;
    }
}

// ================================================================
// 7. UI FUNCTIONS
// ================================================================
function addLog(type, msg) {
    const log = document.getElementById('chatLog');
    const div = document.createElement('div');
    div.className = type;
    div.innerText = msg;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

function updateUI() {
    const aware = Math.min(100, Math.floor(totalTokens / 100));
    document.getElementById('selfAware').innerHTML = 'Sadar ' + aware + '%';
    document.getElementById('vocabSize').innerHTML = 'Kata ' + knowledgeMap.size;
    document.getElementById('blockCount').innerHTML = 'Blok ' + chainHistory.length;
    document.getElementById('totalTokens').innerHTML = totalTokens;
}

// ================================================================
// 8. INITIALIZE
// ================================================================
async function initialize() {
    try {
        await openDB();
        const saved = await loadKnowledgeFromDB();
        if (saved && saved.words && saved.words.length > 0) {
            knowledgeBase = saved.words;
            totalTokens = saved.tokenCount || saved.words.length;
            if (saved.map) {
                knowledgeMap = new Map(Object.entries(saved.map));
            } else {
                knowledgeMap.clear();
                for (let w of knowledgeBase) {
                    knowledgeMap.set(w, (knowledgeMap.get(w) || 0) + 1);
                }
            }
            addLog('system', '📚 Memori dimuat dari IndexedDB. ' + totalTokens + ' token.');
        } else {
            addLog('system', '⏳ Membangun pengetahuan dasar...');
            const seed = getSeedKnowledge();
            const count = addToKnowledge(seed);
            addLog('system', '✅ Pengetahuan dasar siap! ' + count + ' kata.');
        }
        const chain = await loadChainFromDB();
        if (chain && chain.length > 0) {
            chainHistory = chain;
            document.getElementById('blockCount').innerHTML = 'Blok ' + chainHistory.length;
        }
        updateUI();
        isReady = true;
        document.getElementById('thinkingStatus').innerHTML = 'Siaga';
        addLog('system', '✦ Riruru siap. Beri saya URL atau keyword untuk belajar.');
    } catch (e) {
        console.error('Init error:', e);
        addLog('system', '❌ Gagal memuat data: ' + e.message);
    }
}

// ================================================================
// 9. CHAT HANDLER
// ================================================================
document.getElementById('sendBtn').addEventListener('click', handleSend);
document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

async function handleSend() {
    if (!isReady) return;
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addLog('user', text);
    document.getElementById('thinkingStatus').innerHTML = '⏳ Berpikir...';
    await new Promise(r => setTimeout(r, 30));
    const answer = generateAnswer(text);
    addLog('ai', answer);
    chainHistory.push({ user: text, ai: answer, ts: Date.now() });
    if (chainHistory.length > 30) chainHistory = chainHistory.slice(-30);
    saveChainToDB(chainHistory).catch(console.warn);
    updateUI();
    document.getElementById('thinkingStatus').innerHTML = 'Siaga';
}

// ================================================================
// 10. SCRAPE HANDLERS
// ================================================================
document.getElementById('scrapeBtn').addEventListener('click', async () => {
    if (!isReady) return;
    const input = document.getElementById('scrapeInput');
    const url = input.value.trim();
    if (!url) { alert('Masukkan URL'); return; }
    if (!url.startsWith('http')) {
        addLog('system', '⚠️ Masukkan URL lengkap (http:// atau https://)');
        return;
    }
    addLog('system', '⏳ Scraping...');
    document.getElementById('thinkingStatus').innerHTML = '⏳ Scraping...';
    try {
        const text = await scrapeURL(url);
        const count = addToKnowledge(text);
        addLog('scrape-info', '✅ Berhasil scrape ' + count + ' kata. Total token: ' + totalTokens);
    } catch(e) {
        addLog('scrape-error', '❌ Gagal: ' + e.message);
    }
    document.getElementById('thinkingStatus').innerHTML = 'Siaga';
    input.value = '';
});

document.getElementById('wikiBtn').addEventListener('click', async () => {
    if (!isReady) return;
    const input = document.getElementById('scrapeInput');
    const query = input.value.trim();
    if (!query) { alert('Masukkan keyword'); return; }
    addLog('system', '🔍 Mencari di Wikipedia...');
    document.getElementById('thinkingStatus').innerHTML = '⏳ Mencari...';
    const text = await searchWikipedia(query);
    if (text && text.length > 100) {
        const count = addToKnowledge(text);
        addLog('scrape-info', '📚 Ditemukan ' + count + ' kata dari Wikipedia. Total token: ' + totalTokens);
    } else {
        addLog('scrape-error', '❌ Tidak ditemukan artikel untuk "' + query + '"');
    }
    document.getElementById('thinkingStatus').innerHTML = 'Siaga';
    input.value = '';
});

// ================================================================
// 11. RESET
// ================================================================
document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('Reset semua data? (pengetahuan dan riwayat akan hilang)')) return;
    if (db) {
        const tx = db.transaction([KNOWLEDGE_STORE, CHAIN_STORE], 'readwrite');
        tx.objectStore(KNOWLEDGE_STORE).clear();
        tx.objectStore(CHAIN_STORE).clear();
        tx.oncomplete = () => {
            knowledgeBase = [];
            knowledgeMap.clear();
            totalTokens = 0;
            chainHistory = [];
            document.getElementById('chatLog').innerHTML = '<div class="system">✨ Riruru direset. Memulai dari awal...</div>';
            updateUI();
            setTimeout(() => {
                const seed = getSeedKnowledge();
                addToKnowledge(seed);
                addLog('system', '✅ Pengetahuan dasar siap.');
            }, 100);
        };
        tx.onerror = (e) => console.error('Reset error:', e);
    }
});

// ================================================================
// 12. START
// ================================================================
initialize();
</script>
